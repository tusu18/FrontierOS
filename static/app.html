<script type="text/babel">
/* FrontierOS — Knowledge Graph (force-directed, interactive) */
const NODE_COLORS = {
  paper: 'var(--n-paper)', method: 'var(--n-method)', dataset: 'var(--n-dataset)',
  benchmark: 'var(--n-benchmark)', claim: 'var(--n-claim)', limitation: 'var(--n-limitation)',
  future: 'var(--n-future)', gap: 'var(--n-gap)', author: 'var(--n-author)', institution: 'var(--n-inst)',
};
const NODE_HEX = {
  paper: '#5b9bff', method: '#a78bfa', dataset: '#2fcf9e', benchmark: '#34d9e0', claim: '#f4cf4a',
  limitation: '#f2607d', future: '#f4a52a', gap: '#ff8fc7', author: '#9aa6b2', institution: '#d8dee6',
};
const TYPE_LABEL = {
  paper: 'Paper', method: 'Method', dataset: 'Dataset', benchmark: 'Benchmark', claim: 'Claim',
  limitation: 'Limitation', future: 'Future Work', gap: 'Research Gap', author: 'Author', institution: 'Institution',
};

function useForceSim(graph, W, H) {
  const stateRef = useRef(null);
  const [, tick] = useState(0);

  if (!stateRef.current) {
    const nodes = graph.nodes.map((n, i) => ({
      ...n,
      x: W / 2 + Math.cos(i) * 140 + (Math.random() - .5) * 60,
      y: H / 2 + Math.sin(i) * 140 + (Math.random() - .5) * 60,
      vx: 0, vy: 0,
      r: n.type === 'paper' ? 11 : 6 + Math.min(7, Math.sqrt(n.freq) * 1.3),
    }));
    const idx = Object.fromEntries(nodes.map((n, i) => [n.id, i]));
    const links = graph.links.map(([a, b]) => ({ a: idx[a], b: idx[b] }));
    stateRef.current = { nodes, links, idx, alpha: 1 };
  }

  useEffect(() => {
    let raf;
    const step = () => {
      const st = stateRef.current;
      if (!st) return;
      const { nodes, links } = st;
      st.alpha *= 0.992;
      const k = 0.04 + st.alpha * 0.06;
      // repulsion
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const A = nodes[i], B = nodes[j];
          let dx = A.x - B.x, dy = A.y - B.y;
          let d2 = dx * dx + dy * dy || 1;
          const f = 4400 / d2;
          const d = Math.sqrt(d2);
          const fx = (dx / d) * f, fy = (dy / d) * f;
          A.vx += fx; A.vy += fy; B.vx -= fx; B.vy -= fy;
        }
      }
      // springs
      for (const l of links) {
        const A = nodes[l.a], B = nodes[l.b];
        let dx = B.x - A.x, dy = B.y - A.y;
        const d = Math.sqrt(dx * dx + dy * dy) || 1;
        const f = (d - 118) * 0.012;
        const fx = (dx / d) * f, fy = (dy / d) * f;
        A.vx += fx; A.vy += fy; B.vx -= fx; B.vy -= fy;
      }
      // center gravity + integrate
      for (const n of nodes) {
        if (n.fixed) { n.vx = 0; n.vy = 0; continue; }
        n.vx += (W / 2 - n.x) * 0.0015;
        n.vy += (H / 2 - n.y) * 0.0015;
        n.vx *= 0.86; n.vy *= 0.86;
        n.x += n.vx * k * 6; n.y += n.vy * k * 6;
        n.x = Math.max(n.r + 6, Math.min(W - n.r - 6, n.x));
        n.y = Math.max(n.r + 6, Math.min(H - n.r - 6, n.y));
      }
      tick(t => t + 1);
      raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [W, H]);

  return stateRef.current;
}

function KnowledgeGraph() {
  const { GRAPH } = window.RR_DATA;
  const W = 1000, H = 620;
  const sim = useForceSim(GRAPH, W, H);
  const [sel, setSel] = useState(null);
  const [hover, setHover] = useState(null);
  const [view, setView] = useState({ x: 0, y: 0, z: 1 });
  const [filter, setFilter] = useState('all');
  const [depth, setDepth] = useState(2);
  const dragRef = useRef(null);
  const panRef = useRef(null);
  const stageRef = useRef(null);

  // neighbor set for highlight
  const neighbors = useMemo(() => {
    const focus = sel || hover;
    if (focus == null) return null;
    const adj = new Set([focus]);
    let frontier = [focus];
    for (let d = 0; d < depth; d++) {
      const next = [];
      for (const l of GRAPH.links) {
        const a = sim.idx[l[0]], b = sim.idx[l[1]];
        if (adj.has(a) && !adj.has(b)) { adj.add(b); next.push(b); }
        if (adj.has(b) && !adj.has(a)) { adj.add(a); next.push(a); }
      }
      frontier = next;
    }
    return adj;
  }, [sel, hover, depth, sim]);

  const selNode = sel != null ? sim.nodes[sel] : null;
  const connectedPapers = useMemo(() => {
    if (sel == null) return [];
    const out = new Set();
    for (const l of GRAPH.links) {
      const a = sim.idx[l[0]], b = sim.idx[l[1]];
      if (a === sel && sim.nodes[b].type === 'paper') out.add(sim.nodes[b].label);
      if (b === sel && sim.nodes[a].type === 'paper') out.add(sim.nodes[a].label);
    }
    return [...out];
  }, [sel, sim]);

  function onNodeDown(e, i) {
    e.stopPropagation();
    const n = sim.nodes[i];
    n.fixed = true;
    dragRef.current = { i, startX: e.clientX, startY: e.clientY, nx: n.x, ny: n.y };
    setSel(i);
  }
  function onMove(e) {
    if (dragRef.current) {
      const d = dragRef.current; const n = sim.nodes[d.i];
      n.x = d.nx + (e.clientX - d.startX) / view.z;
      n.y = d.ny + (e.clientY - d.startY) / view.z;
    } else if (panRef.current) {
      const p = panRef.current;
      setView(v => ({ ...v, x: p.vx + (e.clientX - p.sx), y: p.vy + (e.clientY - p.sy) }));
    }
  }
  function onUp() {
    if (dragRef.current) sim.nodes[dragRef.current.i].fixed = false;
    dragRef.current = null; panRef.current = null;
  }
  function onStageDown(e) { panRef.current = { sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y }; }
  function zoom(dz) { setView(v => ({ ...v, z: Math.max(0.4, Math.min(2.4, v.z + dz)) })); }

  const types = ['all', ...Object.keys(TYPE_LABEL)];

  return (
    <div className="page wide fade-in">
      <PageHead crumb="Research Memory" title="Knowledge Graph"
        sub="Explore how papers, methods, datasets, claims, limitations and research gaps connect over time. Drag nodes, click to inspect, scroll the legend to filter.">
        <button className="btn" onClick={() => { setSel(null); setView({ x: 0, y: 0, z: 1 }); }}><Icon name="reset" size={14} /> Reset view</button>
      </PageHead>

      <div className="controls">
        <div className="search-field" style={{ maxWidth: 280, flex: 'none' }}>
          <Icon name="search" size={15} stroke="var(--d-text-3)" />
          <input placeholder="Search entity…" />
        </div>
        <select className="ctl" value={filter} onChange={e => setFilter(e.target.value)}>
          {types.map(t => <option key={t} value={t}>{t === 'all' ? 'All entity types' : TYPE_LABEL[t]}</option>)}
        </select>
        <select className="ctl" value={depth} onChange={e => setDepth(+e.target.value)}>
          <option value={1}>Depth · 1 hop</option>
          <option value={2}>Depth · 2 hops</option>
          <option value={3}>Depth · 3 hops</option>
        </select>
        <span className="mono-label" style={{ color: 'var(--d-text-3)', marginLeft: 'auto' }}>
          {GRAPH.nodes.length} entities · {GRAPH.links.length} relationships
        </span>
      </div>

      <div className="split" style={{ gridTemplateColumns: '1fr 340px' }}>
        <div className="graph-stage" ref={stageRef}
          onMouseDown={onStageDown} onMouseMove={onMove} onMouseUp={onUp} onMouseLeave={onUp}
          onWheel={e => { e.preventDefault(); zoom(-e.deltaY * 0.0012); }}>
          <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="xMidYMid meet">
            <g transform={`translate(${view.x} ${view.y}) scale(${view.z})`} style={{ transformOrigin: 'center' }}>
              {sim.links.map((l, i) => {
                const A = sim.nodes[l.a], B = sim.nodes[l.b];
                const dim = neighbors && !(neighbors.has(l.a) && neighbors.has(l.b));
                return <line key={i} className="glink" x1={A.x} y1={A.y} x2={B.x} y2={B.y}
                  style={{ opacity: dim ? 0.06 : 0.5, stroke: (neighbors && !dim) ? 'var(--accent)' : 'var(--d-border-2)' }} />;
              })}
              {sim.nodes.map((n, i) => {
                const dimType = filter !== 'all' && n.type !== filter;
                const dim = (neighbors && !neighbors.has(i)) || dimType;
                const isSel = sel === i;
                return (
                  <g key={n.id} className="gnode" transform={`translate(${n.x} ${n.y})`}
                    style={{ opacity: dim ? 0.18 : 1 }}
                    onMouseDown={e => onNodeDown(e, i)}
                    onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)}>
                    {(isSel || hover === i) && !dim &&
                      <circle r={n.r + 9} fill={NODE_HEX[n.type]} opacity={isSel ? 0.18 : 0.1} />}
                    <circle r={n.r + (isSel ? 4 : 0)} fill={NODE_HEX[n.type]}
                      stroke={isSel ? 'var(--d-text)' : 'rgba(0,0,0,.28)'} strokeWidth={isSel ? 2 : 1} />
                    {(n.r > 9 || isSel || hover === i) &&
                      <text x={n.r + 5} y={4} style={{ fontSize: 11, fontWeight: isSel ? 600 : 400, fill: isSel ? 'var(--d-text)' : 'var(--d-text-2)' }}>{n.label}</text>}
                  </g>
                );
              })}
            </g>
          </svg>

          <div className="graph-tools">
            <button className="icon-btn" onClick={() => zoom(0.2)}><Icon name="plus" size={15} /></button>
            <button className="icon-btn" onClick={() => zoom(-0.2)}><Icon name="minus" size={15} /></button>
          </div>

          <div className="graph-legend">
            {Object.keys(TYPE_LABEL).map(t => (
              <div className="lg" key={t} onClick={() => setFilter(filter === t ? 'all' : t)} style={{ cursor: 'pointer', opacity: filter !== 'all' && filter !== t ? .4 : 1 }}>
                <i style={{ background: NODE_HEX[t] }}></i>{TYPE_LABEL[t]}
              </div>
            ))}
          </div>
        </div>

        <div>
          <div className="card entity-panel">
            {selNode ? (
              <div className="fade-in">
                <span className="etype" style={{ color: NODE_HEX[selNode.type] }}>{TYPE_LABEL[selNode.type]}</span>
                <h3>{selNode.label}</h3>
                <p style={{ color: 'var(--d-text-2)', fontSize: 14, lineHeight: 1.5, margin: '0 0 8px' }}>
                  {selNode.type === 'gap' ? 'An unresolved research direction recurring across multiple papers and categories.'
                    : selNode.type === 'method' ? 'A technique appearing across the corpus, linked to the papers that employ it.'
                    : selNode.type === 'paper' ? 'A paper in research memory, connected to its methods, datasets, claims and gaps.'
                    : 'An entity in the shared research memory graph.'}
                </p>
                <div className="entity-stat"><span>Frequency in memory</span><b>{selNode.freq}×</b></div>
                <div className="entity-stat"><span>First seen</span><b>2026-04-11</b></div>
                <div className="entity-stat"><span>Last seen</span><b>2026-05-29</b></div>
                <div className="entity-stat"><span>Connected papers</span><b>{connectedPapers.length}</b></div>
                {connectedPapers.length > 0 && (
                  <div style={{ marginTop: 14 }}>
                    <div className="sb-cap" style={{ padding: '0 0 8px' }}>Connected papers</div>
                    {connectedPapers.map(p => (
                      <div key={p} style={{ fontSize: 13, color: 'var(--d-text-2)', padding: '7px 0', borderTop: '1px solid var(--d-border)', display: 'flex', gap: 8 }}>
                        <span style={{ color: 'var(--n-paper)' }}>●</span>{p}
                      </div>
                    ))}
                  </div>
                )}
                <button className="btn btn-accent btn-sm" style={{ marginTop: 16, width: '100%', justifyContent: 'center' }}>Expand neighborhood</button>
              </div>
            ) : (
              <div style={{ textAlign: 'center', padding: '30px 0', color: 'var(--d-text-3)' }}>
                <div className="stub-ic" style={{ margin: '0 auto 16px' }}><Icon name="graph" size={26} /></div>
                <p style={{ fontSize: 14, lineHeight: 1.5 }}>Click any node to inspect an entity, its frequency, and connected papers.</p>
              </div>
            )}
          </div>

          <div className="card card-pad" style={{ marginTop: 16 }}>
            <div className="section-title" style={{ fontSize: 15 }}>Top connected entities</div>
            {[...GRAPH.nodes].filter(n => n.type !== 'paper').sort((a, b) => b.freq - a.freq).slice(0, 6).map(n => (
              <div key={n.id} className="trend-row" onClick={() => setSel(sim.idx[n.id])} style={{ cursor: 'pointer' }}>
                <span style={{ display: 'flex', gap: 8, alignItems: 'center' }}><i style={{ width: 8, height: 8, borderRadius: '50%', background: NODE_HEX[n.type], display: 'inline-block' }}></i>{n.label}</span>
                <b>{n.freq}×</b>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

Object.assign(window, { KnowledgeGraph, NODE_HEX, TYPE_LABEL });

</script>

/* FrontierOS — pages (dashboard, daily, deep dive, trends, gaps) */

          <div>Papers in memory<b>{(KPIS.find(k=>k.label==='Total Papers')||{}).value||'—'}</b></div>
          <div>KG entities<b>{(KPIS.find(k=>k.label==='KG Entities')||{}).value||'—'}</b></div>
          <div>High-opp today<b>{(KPIS.find(k=>k.label==='High-Opportunity Papers')||{}).value||'—'}</b></div>
          <div>Code-ready<b>{(KPIS.find(k=>k.label==='Code-Ready Papers')||{}).value||'—'}</b></div>
        </div>
      </div>

      <div style={{ height: 22 }} />
      <div className="kpi-grid">{KPIS.map(k => <KpiCard key={k.label} kpi={k} />)}</div>

      <div style={{ height: 30 }} />
      <div className="section-title">Today's intelligence</div>
      <div className="intel-strip">
        {INTEL.map(it => (
          <div key={it.k} className="card intel">
            <div className="ik">{it.k}</div>

          </div>
        ))}
      </div>

      <div style={{ height: 30 }} />
      <div className="section-title">Top papers today <span className="count">ranked by opportunity</span>
        <button className="btn btn-sm btn-ghost" style={{ marginLeft: 'auto' }} onClick={() => setPage('daily')}>View all 50 <Icon name="arrow" size={13} /></button>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
        {[...PAPERS].sort((a, b) => b.scores.opportunity - a.scores.opportunity).slice(0, 4).map(p => (
          <PaperCard key={p.id} paper={p} onOpen={onOpen} onAction={onAction} />
        ))}
      </div>
    </div>
  );
}

/* =================== DAILY PAPERS =================== */
function DailyPapersPage({ onOpen, onAction, activeCats }) {
  const { PAPERS, CATS } = window.RR_DATA;
  const [q, setQ] = useState('');
  const [cat, setCat] = useState('all');
  const [sort, setSort] = useState('opportunity');
  const [onlyCode, setOnlyCode] = useState(false);
  const [colab, setColab] = useState(false);

  const list = useMemo(() => {
    let r = PAPERS.filter(p =>
      (cat === 'all' || p.cat === cat) &&
      (!onlyCode || p.code) && (!colab || p.colab) &&
      (q === '' || (p.title + p.summary + p.tags.join()).toLowerCase().includes(q.toLowerCase()))
    );
    const key = { opportunity: 'opportunity', novelty: 'novelty', impact: 'impact', build: 'build' }[sort];
    if (sort === 'date') r = [...r].sort((a, b) => b.date.localeCompare(a.date));
    else if (sort === 'reprod') r = [...r].sort((a, b) => a.scores.reprod.localeCompare(b.scores.reprod));
    else r = [...r].sort((a, b) => b.scores[key] - a.scores[key]);
    return r;
  }, [q, cat, sort, onlyCode, colab]);

  return (
    <div className="page fade-in">
      <PageHead crumb="Feed" title="Daily Papers" sub={`${list.length} CS papers ranked by research opportunity.`} />
      <div className="controls">
        <div className="search-field">
          <Icon name="search" size={15} stroke="var(--d-text-3)" />
          <input placeholder="Search papers…" value={q} onChange={e => setQ(e.target.value)} />
        </div>
        <select className="ctl" value={cat} onChange={e => setCat(e.target.value)}>
          <option value="all">All categories</option>
          {CATS.map(c => <option key={c} value={c}>{c}</option>)}
        </select>
        <select className="ctl" value={sort} onChange={e => setSort(e.target.value)}>
          <option value="opportunity">Sort · Opportunity</option>
          <option value="novelty">Sort · Novelty</option>
          <option value="impact">Sort · Impact</option>
          <option value="reprod">Sort · Reproducibility</option>
          <option value="build">Sort · Buildability</option>
          <option value="date">Sort · Date</option>
        </select>
        <span className={`toggle-chip${onlyCode ? ' on' : ''}`} onClick={() => setOnlyCode(v => !v)}><span className="sw"></span> Only with code</span>
        <span className={`toggle-chip${colab ? ' on' : ''}`} onClick={() => setColab(v => !v)}><span className="sw"></span> Colab-friendly</span>
      </div>
      <div style={{ display: 'grid', gap: 16 }}>
        {list.map(p => <PaperCard key={p.id} paper={p} onOpen={onOpen} onAction={onAction} />)}
        {list.length === 0 && <div className="card card-pad" style={{ textAlign: 'center', color: 'var(--d-text-3)' }}>No papers match these filters.</div>}
      </div>
    </div>
  );
}

/* =================== PAPER DEEP DIVE =================== */
function DeepDivePage({ paper, onAction, setPage }) {
  const { PAPERS } = window.RR_DATA;
  const p = paper || PAPERS[0];
  const [tab, setTab] = useState('Summary');
  const tabs = ['Summary', 'Method', 'Claims', 'Datasets', 'Limitations', 'Future Work', 'Related', 'Memory', 'Code'];
  const s = p.scores;

  const claims = [
    { claim: 'Outperforms baseline on multi-step tasks', dataset: p.datasets[0] || 'HotpotQA', metric: 'Success@1', base: '61.2', imp: '+8.4', ev: 'Table 3', conf: 'High' },
    { claim: 'Reduces failure repetition', dataset: p.datasets[1] || 'BEIR', metric: 'Repeat-err', base: '14.1%', imp: '−9.3pp', ev: 'Fig 5', conf: 'Medium' },
    { claim: 'Maintains latency budget', dataset: 'Internal', metric: 'p95 ms', base: '820', imp: '+6%', ev: 'App. B', conf: 'Medium' },
  ];
  const limits = [
    { l: 'Evaluated mostly on English benchmarks', ev: 'Datasets section', sev: 'Medium', ext: 'Multilingual long-horizon eval suite' },
    { l: 'Compute cost grows with memory size', ev: 'Section 6', sev: 'High', ext: 'Adaptive memory pruning' },
  ];

  const Pane = () => {
    switch (tab) {
      case 'Summary': return (<div className="fade-in">
        <DDBlock t="One-line summary" v={p.summary} />
        <DDBlock t="Problem" v={p.problem} />
        <DDBlock t="Main contribution" v={p.contribution} />
        <DDBlock t="Why it matters" v={p.matters} />
        <DDBlock t="Who should read this" v={p.who} />
      </div>);
      case 'Method': return (<div className="fade-in">
        <DDBlock t="Main technical idea" v={p.contribution} />
        <DDBlock t="Architecture" v={`A ${p.methods[0]} module feeds a downstream policy; inputs are encoded, routed through ${p.methods[1] || 'the core component'}, and decoded into actions.`} />
        <DDBlock t="Key methods" v={p.methods.join(' · ')} />
        <DDBlock t="Inputs → outputs" v="Natural-language task + context → structured plan + verified tool calls → final response." />
      </div>);
      case 'Claims': return (<div className="fade-in card" style={{ overflow: 'hidden' }}>
        <table className="rr"><thead><tr><th>Claim</th><th>Dataset</th><th>Metric</th><th>Baseline</th><th>Improve</th><th>Evidence</th><th>Conf.</th></tr></thead>
          <tbody>{claims.map((c, i) => <tr key={i}><td><b>{c.claim}</b></td><td>{c.dataset}</td><td>{c.metric}</td><td>{c.base}</td><td style={{ color: 'var(--green-300)' }}>{c.imp}</td><td>{c.ev}</td><td>{c.conf}</td></tr>)}</tbody>
        </table></div>);
      case 'Datasets': return (<div className="fade-in" style={{ display: 'grid', gap: 12 }}>
        {p.datasets.map(d => <div key={d} className="card card-pad" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}><div><b style={{ fontFamily: 'var(--font-display)' }}>{d}</b><div style={{ fontSize: 12.5, color: 'var(--d-text-3)', marginTop: 4 }}>Used for evaluation · public</div></div><Badge variant="green">in memory</Badge></div>)}
      </div>);
      case 'Limitations': return (<div className="fade-in" style={{ display: 'grid', gap: 12 }}>
        {limits.map((l, i) => <div key={i} className="card card-pad" style={{ borderLeft: '2px solid var(--rose)' }}>
          <div style={{ fontWeight: 500, marginBottom: 8 }}>{l.l}</div>
          <div className="entity-stat" style={{ borderTop: 'none', padding: '4px 0' }}><span>Evidence</span><b>{l.ev}</b></div>
          <div className="entity-stat" style={{ padding: '4px 0' }}><span>Severity</span><b>{l.sev}</b></div>
          <div className="entity-stat" style={{ padding: '4px 0' }}><span>Possible extension</span><b style={{ color: 'var(--accent)' }}>{l.ext}</b></div>
        </div>)}
      </div>);
      case 'Future Work': return (<div className="fade-in"><DDBlock t="Authors' stated directions" v="Scaling the memory router to multi-agent settings; learning when to forget; benchmarking long-horizon reliability." /><DDBlock t="FrontierOS extension" v="Combine with a typed-contract tool layer to bound failure modes during long-horizon execution." /></div>);

<!-- Context Engine pages (Near My Work, Directives, Novelty Radar, etc.) -->
<script type="text/babel">
/* FrontierOS — Context Engine pages (the differentiator)
   Near My Work · Research Context · Directives · Novelty Radar · Living Related Work · Citation Advisor */

const CTX = () => window.RR_DATA.CONTEXT;
const PBY = (id) => window.RR_DATA.PAPERS.find(p => p.id === id) || window.RR_DATA.PAPERS[0];

/* classification → label + color */
const CLS = {
  'must-cite': { label: 'Must cite', c: 'var(--accent)', ic: 'check' },
  'competing': { label: 'Competing work', c: '#f2607d', ic: 'flame' },
  'baseline': { label: 'Useful baseline', c: '#5b9bff', ic: 'compare' },
  'dataset': { label: 'Useful dataset', c: '#34d9e0', ic: 'layers' },
  'method': { label: 'Useful method', c: '#a78bfa', ic: 'code' },
  'collab': { label: 'Potential collaborator', c: '#f4a52a', ic: 'spark' },
  'low': { label: 'Low relevance', c: 'var(--d-text-3)', ic: 'minus' },
};
const CONF = { High: '#2fcf9e', Medium: '#f4a52a', Low: '#f2607d' };

/* ---- shared: score ring ---- */
function Ring({ value, size = 64, label }) {
  const r = (size - 10) / 2, c = 2 * Math.PI * r, off = c * (1 - value / 100);
  const col = value >= 80 ? 'var(--accent)' : value >= 55 ? '#5b9bff' : value >= 40 ? '#f4a52a' : 'var(--d-text-3)';
  return (
    <div className="ring-wrap" style={{ width: size, height: size }}>
      <svg width={size} height={size}>
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="var(--d-border)" strokeWidth="5" />
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={col} strokeWidth="5" strokeLinecap="round"
          strokeDasharray={c} strokeDashoffset={off} transform={`rotate(-90 ${size / 2} ${size / 2})`}
          style={{ transition: 'stroke-dashoffset 1s cubic-bezier(.22,.61,.36,1)' }} />
      </svg>
      <div className="ring-num"><b>{value}</b>{label && <span>{label}</span>}</div>
    </div>
  );
}

/* ---- shared: classification badge ---- */
function ClsBadge({ cls, sm }) {
  const x = CLS[cls] || CLS.low;
  return <span className={`cls-badge${sm ? ' sm' : ''}`} style={{ color: x.c, borderColor: x.c, background: `color-mix(in srgb, ${x.c} 12%, transparent)` }}>
    <Icon name={x.ic} size={sm ? 11 : 13} /> {x.label}
  </span>;
}

/* ---- shared: overlap dimension bar ---- */
function OverlapBar({ dim, pct }) {
  return (
    <div className="ov-row">
      <span className="ov-dim">{dim}</span>
      <div className="ov-track"><div className="ov-fill" style={{ width: pct + '%' }} /></div>
      <span className="ov-pct">{pct}%</span>
    </div>
  );
}

/* ---- shared: evidence + uncertainty line ---- */
function Evidence({ quote, conf, uncertainty, paperId }) {
  return (
    <div className="evidence">
      <div className="ev-quote"><Icon name="quote" size={13} stroke="var(--d-text-3)" /> {quote}</div>
      <div className="ev-meta">
        <span className="conf-pill" style={{ color: CONF[conf], borderColor: CONF[conf] }}>
          <span className="conf-dot" style={{ background: CONF[conf] }} /> {conf} confidence
        </span>
        <span className="ev-unc"><Icon name="eye" size={12} /> {uncertainty}</span>
        {paperId && <span className="ev-src">arXiv:{paperId}</span>}
      </div>
    </div>
  );
}

/* =================== NEAR MY WORK (signature) =================== */
function NearMyWorkPage({ onOpen, setPage, flash }) {

  const [filter, setFilter] = useState('all');
  const [open, setOpen] = useState(data.nearWork[0].dupKey || data.nearWork[0].ref);
  const actions = ['all', 'must-cite', 'competing', 'baseline', 'dataset', 'low'];

  const rows = data.nearWork.filter(r => filter === 'all' || r.cls === filter);

  return (
    <div className="page fade-in">
      <PageHead crumb="Context Engine" title="Near My Work"
        sub="FrontierOS compares today's frontier against your private research memory — and tells you why each paper matters to your work.">
        <button className="btn" onClick={() => setPage('context')}><Icon name="layers" size={15} /> Your context</button>
        <button className="btn btn-accent" onClick={async()=>{ flash('Re-scanning…'); const r=await fetch('/api/near-my-work/rescan',{method:'POST'}); const d=await r.json(); flash(d.papers_scored ? `Scored ${d.papers_scored} papers` : 'Rescan complete'); }}><Icon name="reset" size={15} /> Re-scan frontier</button>
      </PageHead>

      <div className="ctx-claimbar">
        <div className="ccb-ic"><Icon name="target" size={18} stroke="var(--accent)" /></div>
        <div>
          <div className="ccb-cap">Scoring against your claimed contribution</div>
          <div className="ccb-claim">{data.claim}</div>
        </div>
      </div>

      <div className="seg-filter">
        {actions.map(a => (
          <button key={a} className={`seg-btn${filter === a ? ' on' : ''}`} onClick={() => setFilter(a)}>
            {a === 'all' ? 'All nearby' : (CLS[a] || {}).label}
            <span className="seg-n">{a === 'all' ? data.nearWork.length : data.nearWork.filter(r => r.cls === a).length}</span>
          </button>
        ))}
      </div>

      <div className="nmw-list">
        {rows.map((r, i) => {
          const p = PBY(r.ref); const key = r.dupKey || r.ref; const isOpen = open === key;
          return (
            <div key={key} className={`nmw-card${isOpen ? ' open' : ''}`}>
              <div className="nmw-top" onClick={() => setOpen(isOpen ? null : key)}>
                <Ring value={r.score} label="near" />
                <div className="nmw-mid">
                  <div className="nmw-badges">
                    <ClsBadge cls={r.cls} />
                    <span className="act-pill"><Icon name="arrow" size={12} /> {r.action}</span>
                  </div>
                  <h3>{p.title}</h3>
                  <div className="nmw-meta">{p.authors.join(', ')} · {p.date} · arXiv:{p.id}</div>
                  <p className="nmw-note">{r.note}</p>
                </div>
                <button className="nmw-exp"><Icon name="chevron" size={16} /></button>
              </div>
              {isOpen && (
                <div className="nmw-detail fade-in">
                  <div className="nmw-cols">
                    <div>
                      <div className="mini-cap">Why it matches your work</div>
                      <div className="ov-list">{r.why.map(([d, pct]) => <OverlapBar key={d} dim={d} pct={pct} />)}</div>
                    </div>
                    <div>
                      <div className="mini-cap">Evidence &amp; uncertainty</div>
                      <Evidence quote={r.evidence} conf={r.conf} uncertainty={r.uncertainty} paperId={p.id} />
                      <div className="nmw-actions">
                        <button className="btn btn-sm btn-accent" onClick={() => onOpen(p)}><Icon name="doc" size={13} /> Deep dive</button>
                        <button className="btn btn-sm" onClick={() => setPage('cite')}><Icon name="quote" size={13} /> Citation advice</button>
                        <button className="btn btn-sm" onClick={() => setPage('novelty')}><Icon name="shield" size={13} /> Novelty impact</button>
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* =================== RESEARCH CONTEXT (private memory) =================== */
const TYPE_IC = { draft: 'doc', notes: 'feed', dataset: 'layers', proposal: 'report', paper: 'bookmark' };
function ResearchContextPage({ flash }) {
  const [items, setItems] = React.useState(CTX().items || []);
  const [uploading, setUploading] = React.useState(false);
  const [fname, setFname] = React.useState('');
  const [content, setContent] = React.useState('');
  const [atype, setAtype] = React.useState('notes');
  const [showForm, setShowForm] = React.useState(false);

  React.useEffect(()=>{
    fetch('/api/context/artifacts').then(r=>r.json()).then(d=>{ if(d.artifacts) setItems(d.artifacts); }).catch(()=>{});
  },[]);

  const upload = async () => {
    if (!fname.trim()||!content.trim()){ flash('Enter a name and paste content'); return; }
    setUploading(true);
    try {
      const r=await fetch('/api/context/upload',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({name:fname.trim(),content,artifact_type:atype})});
      const d=await r.json();
      if(d.ok){
        flash('Uploaded '+d.name+' — extracted '+(d.topics||[]).length+' topics');
        setItems(prev=>[{id:String(d.id),name:d.name,type:atype,topics:d.topics||[],date:new Date().toISOString().slice(0,10),size:'—'},...prev]);
        setFname(''); setContent(''); setShowForm(false);
      }
    } catch(e){ flash('Upload failed — is the server running?'); }
    finally{ setUploading(false); }
  };

  const remove=async(id)=>{
    await fetch('/api/context/artifacts/'+id,{method:'DELETE'}).catch(()=>{});
    setItems(prev=>prev.filter(x=>x.id!==id));
    flash('Removed');
  };

  const TICON={draft:'doc',notes:'report',proposal:'build',dataset:'layers',paper:'feed',other:'gear'};

  return (
    <div className="page fade-in">
      <PageHead crumb="Context Engine" title="Research Context"
        sub="Upload drafts, notes, proposals, and datasets. FrontierOS extracts private entities and uses them to personalise Near My Work, Citation Advisor, and Novelty Radar.">
        <button className="btn btn-accent" onClick={()=>setShowForm(v=>!v)}>
          <Icon name={showForm?'minus':'doc'} size={15}/> {showForm?'Cancel':'Upload context'}
        </button>
      </PageHead>

      {showForm && (
        <div className="card card-pad" style={{marginBottom:20}}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:12}}>
            <div>
              <label style={{fontSize:12,color:'var(--d-text-3)',display:'block',marginBottom:4}}>Name</label>
              <input className="g-input" value={fname} onChange={e=>setFname(e.target.value)}
                placeholder="thesis_draft_v3" style={{width:'100%'}}/>
            </div>
            <div>
              <label style={{fontSize:12,color:'var(--d-text-3)',display:'block',marginBottom:4}}>Type</label>
              <select className="g-input" value={atype} onChange={e=>setAtype(e.target.value)} style={{width:'100%'}}>
                {['draft','notes','proposal','dataset','paper','other'].map(t=>(
                  <option key={t} value={t}>{t[0].toUpperCase()+t.slice(1)}</option>
                ))}
              </select>
            </div>
          </div>
          <label style={{fontSize:12,color:'var(--d-text-3)',display:'block',marginBottom:4}}>Paste content</label>
          <textarea className="g-input" rows={6} value={content} onChange={e=>setContent(e.target.value)}
            placeholder="Paste your draft abstract, lab notes, or proposal here..."
            style={{width:'100%',resize:'vertical',fontFamily:'var(--font-mono)',fontSize:12}}/>
          <div style={{marginTop:12,display:'flex',gap:10,alignItems:'center'}}>
            <button className="btn btn-accent" onClick={upload} disabled={uploading}>
              <Icon name={uploading?'reset':'doc'} size={14}/> {uploading?'Extracting...':'Upload and extract'}
            </button>
            <span style={{fontSize:12,color:'var(--d-text-3)'}}>Extracts topics, methods, claims, open questions.</span>
          </div>
        </div>
      )}

      {items.filter(x=>x.id!=='c0').length===0 ? (
        <div className="stub"><div>
          <div className="stub-ic"><Icon name="layers" size={28}/></div>
          <h2>No context uploaded yet</h2>
          <p>Upload a draft or notes to enable personalised Near My Work scoring.</p>
          <div style={{marginTop:20}}>
            <button className="btn btn-accent" onClick={()=>setShowForm(true)}>Upload context <Icon name="arrow" size={14}/></button>
          </div>
        </div></div>
      ) : (
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:16,marginBottom:24}}>
          {items.filter(x=>x.id!=='c0').map(item=>(
            <div key={item.id} className="card card-pad" style={{position:'relative'}}>
              <div style={{display:'flex',gap:10,alignItems:'center',marginBottom:10}}>
                <Icon name={TICON[item.type]||'doc'} size={18} stroke="var(--accent)"/>
                <div style={{flex:1}}>
                  <div style={{fontWeight:600,fontSize:13,color:'var(--d-text)'}}>{item.name}</div>
                  <div style={{fontSize:11,color:'var(--d-text-3)'}}>{item.type} · {item.date} · {item.size}</div>
                </div>
                <button onClick={()=>remove(item.id)} className="btn btn-sm btn-ghost"
                  style={{padding:'3px 7px',fontSize:11,color:'var(--rose)'}}>x</button>
              </div>
              {(item.topics||[]).length>0 && (

/* =================== RESEARCH DIRECTIVES =================== */
const TEMPLATES = [
  'Track new papers near my thesis',
  'Watch for new benchmarks in this area',
  'Alert me if someone publishes similar work',
  'Find reproducible papers I can build from',
  'Maintain related work for a draft',
];
function DirectivesPage({ flash, setPage }) {
  const [dirs, setDirs] = React.useState(CTX().directives || []);
  const [newText, setNewText] = React.useState('');
  const [cadence, setCadence] = React.useState('daily');
  const [saving, setSaving] = React.useState(false);

  React.useEffect(()=>{
    fetch('/api/directives').then(r=>r.json())
      .then(d=>{ if(d.directives&&d.directives.length) setDirs(d.directives); })
      .catch(()=>{});
  },[]);

  const add=async()=>{
    if(!newText.trim()) return;
    setSaving(true);
    try{
      const r=await fetch('/api/directives',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({goal_text:newText.trim(),cadence})});
      const d=await r.json();
      if(d.ok){ setDirs(prev=>[{id:String(d.id),text:d.text,cadence,active:true,matches:0,new:0},...prev]); setNewText(''); flash('Directive saved'); }
    } catch(e){ flash('Could not save — is the server running?'); }
    finally{ setSaving(false); }
  };

  const remove=async(id)=>{
    await fetch('/api/directives/'+id,{method:'DELETE'}).catch(()=>{});
    setDirs(prev=>prev.filter(d=>d.id!==id)); flash('Removed');
  };

  const toggle=async(id)=>{
    const r=await fetch('/api/directives/'+id+'/toggle',{method:'PUT'}).catch(()=>null);
    const d=r?await r.json().catch(()=>null):null;
    if(d&&d.ok) setDirs(prev=>prev.map(x=>x.id===id?Object.assign({},x,{active:d.active}):x));
  };

  const SUGG=[
    'Track papers near my thesis on agent reliability',
    'Watch for new benchmarks in long-horizon evaluation',
    'Alert me if someone publishes work overlapping my novelty',
    'Find reproducible papers I can build baselines from',
  ];

  return (
    <div className="page fade-in">
      <PageHead crumb="Context Engine" title="Research Directives"
        sub="Create a directive once. FrontierOS continuously tracks the field for you."/>
      <div className="card card-pad" style={{marginBottom:24}}>
        <div style={{fontSize:13,fontWeight:600,color:'var(--d-text)',marginBottom:12}}>New directive</div>
        <textarea className="g-input" rows={3} value={newText} onChange={e=>setNewText(e.target.value)}
          placeholder="e.g. Track papers near my thesis and alert me on novelty risks"
          style={{width:'100%',resize:'vertical',marginBottom:10}}/>
        <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
          <select className="g-input" value={cadence} onChange={e=>setCadence(e.target.value)}>
            <option value="realtime">Realtime</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
          </select>
          <button className="btn btn-accent" onClick={add} disabled={saving||!newText.trim()}>
            <Icon name="spark" size={14}/> {saving?'Saving...':'Add directive'}
          </button>
        </div>
        <div style={{marginTop:12}}>
          <div style={{fontSize:11,color:'var(--d-text-3)',marginBottom:6}}>Quick add:</div>
          <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
            {SUGG.map(s=>(
              <button key={s} className="btn btn-sm btn-ghost" style={{fontSize:11}} onClick={()=>setNewText(s)}>{s.slice(0,44)}...</button>
            ))}
          </div>
        </div>
      </div>
      {dirs.length===0 ? (
        <div style={{textAlign:'center',padding:40,color:'var(--d-text-3)',fontSize:14}}>No directives yet. Add one above.</div>
      ) : dirs.map(d=>(
        <div key={d.id} className="card card-pad" style={{marginBottom:10,borderLeft:'3px solid '+(d.active?'var(--accent)':'var(--d-border)'),opacity:d.active?1:0.6}}>
          <div style={{display:'flex',gap:10,alignItems:'flex-start'}}>
            <div style={{flex:1}}>
              <div style={{fontWeight:500,fontSize:14,color:'var(--d-text)',marginBottom:6}}>{d.text}</div>
              <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                <span style={{fontSize:11,fontFamily:'var(--font-mono)',color:'var(--d-text-3)',background:'var(--d-elev)',padding:'2px 8px',borderRadius:4}}>{d.cadence}</span>
                {d.new>0 && <span style={{fontSize:11,color:'var(--accent)',fontWeight:600}}>{d.new} new matches</span>}
                <span style={{fontSize:11,color:'var(--d-text-3)'}}>{d.matches} total matches</span>
              </div>
            </div>
            <div style={{display:'flex',gap:6,flexShrink:0}}>
              <button className="btn btn-sm" onClick={()=>toggle(d.id)} style={{fontSize:11}}>{d.active?'Pause':'Resume'}</button>
              <button className="btn btn-sm" onClick={()=>remove(d.id)} style={{fontSize:11,color:'var(--rose)'}}>Remove</button>
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

/* =================== CITATION ADVISOR =================== */
function CitationAdvisorPage() {
  const { PAPERS } = window.RR_DATA;
  const pool = CTX().nearWork.map(r => r.ref).filter((v, i, a) => a.indexOf(v) === i);
  const [sel, setSel] = useState(pool[0]);
  const [advice, setAdvice] = React.useState(null);
  const [advLoading, setAdvLoading] = React.useState(false);
  const getAdvice=async(pid)=>{ if(!pid) return; setAdvice(null); setAdvLoading(true);
    try{ const r=await fetch('/api/papers/'+pid+'/cite',{method:'POST'});
      if(r.ok) setAdvice(await r.json()); } catch(e){}  finally{ setAdvLoading(false); } };
  React.useEffect(()=>{ if(sel) getAdvice(sel); },[sel]);
  const [phase, setPhase] = useState('idle'); // idle | thinking | done
  const p = PBY(sel);

  const VERDICTS = {
    '2605.14021': { v: 'Yes — cite', pos: true, where: '§2 Long-horizon agents (primary mechanism)', why: 'It is the closest prior mechanism to your trace-reuse intuition and a natural object of comparison for your benchmark.', diff: 'They optimize a routing mechanism; you contribute the evaluation protocol and failure taxonomy that measures it.', sentence: 'Mehta et al. (2026) route agent steps through a persistent retrieval memory; our benchmark is designed to stress-test exactly this class of long-horizon mechanism.', conf: 'High', unc: 'Full-text verified' },
    '2605.13310': { v: 'Yes — but contrast', pos: true, where: '§4 Evaluation (as a competing metric)', why: 'It proposes an evaluation metric adjacent to your contribution, so reviewers will expect a contrast.', diff: 'They measure decomposition via routing entropy; you offer a reproducibility-first protocol with an explicit failure taxonomy.', sentence: 'Whereas [13310] assess decomposition quality through routing entropy, we prioritise reproducibility and a standardized failure taxonomy.', conf: 'Medium', unc: 'Abstract-only — full text pending' },
    '2605.13455': { v: 'Optional — baseline', pos: false, where: '§3 Reliability & tooling (baseline)', why: 'A clean reliability baseline, but it targets call validity rather than long-horizon evaluation — cite only if you use it as a baseline.', diff: 'They verify single tool calls; you evaluate end-to-end reliability across many steps.', sentence: 'We adopt the typed-contract checks of [13455] as a per-call baseline, extending evaluation to full multi-step horizons.', conf: 'High', unc: 'Full-text verified' },
    '2605.13177': { v: 'No — tangential', pos: false, where: '—', why: 'Surfaced on a shared dataset keyword only; no method or claim overlap with your contribution.', diff: 'Embodied failure replay is a different setting from your text-agent reliability benchmark.', sentence: '—', conf: 'Low', unc: 'Weak signal — topic only' },
  };
  const ans = VERDICTS[sel] || VERDICTS['2605.14021'];

  const ask = () => {
    setPhase('thinking');
    getAdvice(sel).then(() => setPhase('done')).catch(() => { setPhase('done'); });
  };
  useEffect(() => { setPhase('idle'); }, [sel]);

  return (
    <div className="page fade-in">
      <PageHead crumb="Context Engine" title="Citation Advisor"
        sub="Should you cite this? FrontierOS answers with a verdict, where to cite, why it matters, how it differs from your work — and the sentence, all backed by evidence." />

      <div className="ca-pick">
        <div className="sb-cap" style={{ marginBottom: 8 }}>Ask about a paper near your work</div>
        <div className="ca-chips">
          {pool.map(id => <button key={id} className={`ca-chip${sel === id ? ' on' : ''}`} onClick={() => setSel(id)}>{PBY(id).title.slice(0, 40)}…</button>)}
        </div>
        <div className="ca-q">
          <span>“Should I cite <b>{p.title}</b> in my proposal?”</span>
          <button className="btn btn-accent btn-sm" onClick={ask} disabled={phase === 'thinking'}>
            <Icon name="spark" size={14} /> {phase === 'done' ? 'Re-evaluate' : 'Ask advisor'}
          </button>
        </div>
      </div>

      {phase === 'thinking' && (
        <div className="ca-thinking fade-in">
          <span className="dots"><i /><i /><i /></span> Comparing against your private context…
        </div>
      )}

      {phase === 'done' && (
        <div className="ca-answer fade-in">
          {advice && (
            <div className="card card-pad" style={{marginBottom:16,borderLeft:'3px solid '+(advice.should_cite?'var(--accent)':'#f2607d'),padding:'14px 16px'}}>
              <div style={{display:'flex',gap:10,alignItems:'center',marginBottom:10}}>
                <span style={{fontSize:20,color:advice.should_cite?'var(--accent)':'#f2607d'}}>{advice.should_cite?'✓':'✗'}</span>
                <div style={{flex:1}}>
                  <div style={{fontWeight:600,color:'var(--d-text)',fontSize:14}}>{advice.should_cite?'Yes — cite this':'Not recommended'}</div>
                  <div style={{fontSize:12,color:'var(--d-text-3)'}}>Relevance {advice.citation_relevance_score}/100 · {advice.where_to_cite||'—'} · {advice.citation_role||'—'}</div>
                </div>
                <span style={{fontSize:11,fontFamily:'var(--font-mono)',color:advice.confidence>=0.7?'var(--accent)':'#f4a52a'}}>{Math.round((advice.confidence||0)*100)}% conf</span>
              </div>
              {advice.suggested_citation_sentence && <div style={{background:'var(--d-elev)',borderRadius:8,padding:'10px 14px',fontSize:13,color:'var(--d-text)',fontStyle:'italic',marginBottom:8}}>"{advice.suggested_citation_sentence}"</div>}
              {advice.difference_from_user_work && <div style={{fontSize:12.5,color:'var(--d-text-2)',lineHeight:1.6}}>{advice.difference_from_user_work}</div>}
            </div>
          )}
          <div className={`ca-verdict${ans.pos ? ' yes' : ' no'}`}>
            <Icon name={ans.pos ? 'check' : 'minus'} size={20} />
            <div><b>{ans.v}</b><span>{p.authors.join(', ')} · arXiv:{p.id}</span></div>
          </div>
          <div className="ca-rows">
            <div className="ca-row"><span className="ca-k"><Icon name="target" size={14} /> Where to cite</span><p>{ans.where}</p></div>
            <div className="ca-row"><span className="ca-k"><Icon name="spark" size={14} /> Why it matters</span><p>{ans.why}</p></div>
            <div className="ca-row"><span className="ca-k"><Icon name="compare" size={14} /> How it differs from your work</span><p>{ans.diff}</p></div>
            {ans.sentence !== '—' && (
              <div className="ca-row"><span className="ca-k"><Icon name="quote" size={14} /> Suggested sentence</span>
                <p className="ca-sentence">“{ans.sentence}”</p></div>
            )}
          </div>
          <Evidence quote={`Closest evidence span from the paper supporting this verdict.`} conf={ans.conf} uncertainty={ans.unc} paperId={p.id} />
        </div>
      )}
    </div>
  );
}

<!-- Memory + stub pages -->
<script type="text/babel">
/* FrontierOS — Ask Research Memory (simulated streaming) + stubs */

function MemoryPage() {
  const chips = [
    'What are the fastest-growing RAG topics this week?',
    'Which LLM agent papers have code?',
    'What are unresolved gaps in multimodal reasoning?',
    'Which datasets are overused in cs.CL?',
    'Find papers combining robotics and language models.',
    'Generate a thesis idea from recent AI papers.',
  ];
  const [msgs, setMsgs] = useState([]);
  const [input, setInput] = useState('');
  const [busy, setBusy] = useState(false);
  const endRef = useRef(null);

  useEffect(() => { endRef.current && endRef.current.scrollTo({ top: 1e6 }); });

  function answerFor(q) {
    const ql = q.toLowerCase();
    if (ql.includes('rag') || ql.includes('retriev')) return {
      lead: 'Agentic RAG is the fastest-growing retrieval theme this week, up +42% in paper volume. The momentum is concentrated in planning and memory, not in raw retrieval quality.',
      bullets: ['Tool-use + retrieval planning appears in 18 papers, vs 11 last week.', 'Late-interaction retrieval is displacing two-stage re-ranking for throughput.', 'Evaluation remains the dominant open gap — few papers benchmark long-horizon reliability.'],
      papers: ['Memory-Routed Agents (cs.CL)', 'Retrieval Without Re-ranking (cs.IR)', 'Verifiable Tool Use (cs.SE)'],
      ents: ['Retrieval Planning', 'Tool-Use Agents', 'Long-horizon agent eval'],
      next: ['Open the Trend Radar for velocity detail', 'Generate a reproduction plan for Memory-Routed Agents'],
    };
    if (ql.includes('gap') || ql.includes('multimodal')) return {
      lead: 'The clearest unresolved gap in multimodal reasoning is cross-frame consistency — models are scored in aggregate, which hides systematic temporal failures.',
      bullets: ['Mentioned across 9 papers, concentrated in cs.CV with no shared protocol.', 'CrossModal-Eval proposes a 9-class failure taxonomy but stops short of a temporal-consistency suite.', 'Opportunity score 8.4 / difficulty Hard.'],
      papers: ['CrossModal-Eval (cs.CV)'],
      ents: ['Cross-frame consistency', 'Failure taxonomy', 'MMMU'],
      next: ['Open Research Gaps for the full evidence trail', 'Send this gap to Project Builder'],
    };
    if (ql.includes('thesis') || ql.includes('idea') || ql.includes('project')) return {
      lead: 'A strong, scoped thesis direction from this week: a benchmark for multi-step agent reliability with a failure taxonomy.',
      bullets: ['Sits on a 9.1 opportunity gap recurring in 14 papers across cs.CL / cs.AI / cs.SE.', 'Buildable on a single GPU using existing agent traces.', 'Pairs naturally with typed-contract tool use to bound failure modes.'],
      papers: ['Memory-Routed Agents (cs.CL)', 'Verifiable Tool Use (cs.SE)'],
      ents: ['Long-horizon agent eval', 'Agent reliability benchmark'],
      next: ['Open Project Builder to scope an MVP', 'Generate a reproduction plan'],
    };
    return {
      lead: ((window.RR_DATA.KPIS||[]).find(k=>k.label==='Total Papers')||{value:'?'}).value + ' indexed papers — ' + new Date().toLocaleDateString(),
      bullets: ['Three papers this week ship runnable code with buildability ≥ 8.', 'Small-model reasoning is rising (+38%) and remains low-saturation.', 'LLM benchmarking is saturating (−12%) — diminishing returns for new entrants.'],
      papers: ['Sub-Billion Reasoners (cs.LG)', 'Verifiable Tool Use (cs.SE)'],
      ents: ['Distillation', 'Tool-Use Agents'],
      next: ['Open Daily Papers filtered to code-ready', 'Ask a follow-up to narrow by category'],
    };
  }

  function ask(q) {
    if (!q.trim() || busy) return;
    const a = answerFor(q);
    setMsgs(m => [...m, { role: 'user', text: q }, { role: 'ai', a, streamed: '' }]);
    setInput(''); setBusy(true);
    const full = a.lead;
    let i = 0;
    const iv = setInterval(() => {
      i += 2;
      setMsgs(m => { const c = [...m]; c[c.length - 1] = { ...c[c.length - 1], streamed: full.slice(0, i) }; return c; });
      if (i >= full.length) { clearInterval(iv); setMsgs(m => { const c = [...m]; c[c.length - 1] = { ...c[c.length - 1], done: true }; return c; }); setBusy(false); }
    }, 16);
  }

  return (
    <div className="page fade-in">
      <PageHead crumb="Agentic query" title="Ask Research Memory" sub="Every answer is grounded in papers from your local research database, with connected graph entities and suggested next actions." />
      <div className="chat-wrap" ref={endRef} style={{ maxHeight: 'calc(100vh - 280px)', overflowY: 'auto', paddingRight: 6 }}>
        {msgs.length === 0 && (
          <div className="chips-row">{chips.map(c => <span key={c} className="prompt-chip" onClick={() => ask(c)}>{c}</span>)}</div>
        )}
        {msgs.map((m, i) => m.role === 'user'
          ? <div key={i} className="msg user"><div className="role">You</div><div className="bubble">{m.text}</div></div>
          : <div key={i} className="msg ai"><div className="role">◎ Research Memory</div>
              <div className="bubble">
                <p>{m.streamed}{!m.done && <span className="cursor-blink"></span>}</p>
                {m.done && <div className="fade-in">
                  {m.a.bullets.map((b, j) => <div key={j} className="ev">{b} <span className="cite">[{j + 1}]</span></div>)}
                  <div style={{ marginTop: 14 }}><div className="sb-cap" style={{ padding: '0 0 8px', color: 'var(--accent)' }}>Relevant papers</div>
                    {m.a.papers.map(p => <div key={p} style={{ fontSize: 13.5, padding: '5px 0', color: 'var(--d-text-2)', display: 'flex', gap: 8 }}><span style={{ color: 'var(--n-paper)' }}>●</span>{p}</div>)}
                  </div>
                  <div style={{ display: 'flex', gap: 7, flexWrap: 'wrap', marginTop: 12 }}>{m.a.ents.map(e => <Badge key={e} variant="purple">{e}</Badge>)}</div>
                  <div style={{ marginTop: 14 }}><div className="sb-cap" style={{ padding: '0 0 8px', color: 'var(--accent)' }}>Suggested next actions</div>

function PaperToCodePage() {
  const { PAPERS } = window.RR_DATA;
  const [paper, setPaper] = useState(PAPERS[0].id);
  const [mode, setMode] = useState('PyTorch skeleton');
  const [tab, setTab] = useState('Code');
  const [out, setOut] = useState('');
  const [gen, setGen] = useState(false);
  const p = PAPERS.find(x => x.id === paper);
  const modes = ['Pseudocode', 'PyTorch skeleton', 'Training pipeline', 'Dataset preparation', 'Evaluation script', 'Reproduction plan', 'Minimal prototype', 'Colab notebook', 'GitHub README'];

  const code = `# ${p.title}\n# mode: ${mode} · generated by FrontierOS\n\nimport torch, torch.nn as nn\nfrom frontieros import MemoryRouter, Planner\n\nclass ${p.methods[0].replace(/[^a-z]/gi,'')}(nn.Module):\n    def __init__(self, dim=768):\n        super().__init__()\n        self.router = MemoryRouter(dim)\n        self.policy = nn.TransformerDecoder(...)\n\n    def forward(self, task, context):\n        plan = self.router.retrieve(task)        # ${p.methods[1] || 'retrieval'}\n        return self.policy(plan, context)\n\nif __name__ == "__main__":\n    model = ${p.methods[0].replace(/[^a-z]/gi,'')}()\n    # train on ${p.datasets.join(', ')}`;

  function generate() {
    setGen(true); setOut('');
    let i = 0;
    const iv = setInterval(() => { i += 6; setOut(code.slice(0, i)); if (i >= code.length) { clearInterval(iv); setGen(false); } }, 12);
  }

  return (
    <div className="page fade-in">
      <PageHead crumb="Build" title="Paper-to-Code" sub="Turn a method section into runnable scaffolding scoped to your compute budget." />
      <div className="split" style={{ gridTemplateColumns: '300px 1fr' }}>
        <div>
          <div className="card card-pad">
            <div className="sb-cap" style={{ padding: '0 0 8px' }}>Select paper</div>

            <div className="sb-cap" style={{ padding: '16px 0 8px' }}>Code mode</div>
            <select className="ctl" style={{ width: '100%' }} value={mode} onChange={e => setMode(e.target.value)}>
              {modes.map(m => <option key={m}>{m}</option>)}
            </select>
            <div className="sb-cap" style={{ padding: '16px 0 8px' }}>Options</div>
            {['Use full PDF text', 'Use related papers from memory', 'Prefer Colab-friendly', 'Assume single GPU'].map((o, i) =>
              <label key={o} style={{ display: 'flex', gap: 9, fontSize: 13, color: 'var(--d-text-2)', padding: '6px 0', cursor: 'pointer' }}>
                <input type="checkbox" defaultChecked={i < 2} /> {o}</label>)}
            <button className="btn btn-accent" style={{ width: '100%', justifyContent: 'center', marginTop: 16 }} onClick={generate}>
              <Icon name="code" size={15} /> {gen ? 'Generating…' : 'Generate'}</button>
          </div>
        </div>
        <div>
          <div className="tabs">{['Implementation Plan', 'Code', 'Dataset', 'Evaluation', 'README', 'Risks'].map(t => <button key={t} className={`tab${tab === t ? ' active' : ''}`} onClick={() => setTab(t)}>{t}</button>)}</div>
          <div className="card card-pad" style={{ fontFamily: 'var(--font-mono)', fontSize: 13, lineHeight: 1.7, color: 'var(--d-text-2)', whiteSpace: 'pre-wrap', minHeight: 360 }}>
            {tab === 'Code'
              ? (out || <span style={{ color: 'var(--d-text-3)' }}>{'// press Generate to scaffold an implementation from this paper'}</span>)
              : <span style={{ color: 'var(--d-text-3)' }}>{`// ${tab} for "${p.title}"\n// generated content appears here after running the agent`}</span>}
            {gen && <span className="cursor-blink"></span>}

            <button className="btn btn-sm btn-ghost"><Icon name="bookmark" size={13} /> Save to library</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function ProjectBuilderPage() {
  const papers = (window.RR_DATA.PAPERS||[]).slice().sort(function(a,b){
    return (b.scores&&b.scores.opportunity||0)-(a.scores&&a.scores.opportunity||0); }).slice(0,10);
  const [sel, setSel] = React.useState(null);
  const [plan, setPlan] = React.useState(null);
  const [loading, setLoading] = React.useState(false);
  const generate=async(paper)=>{
    setSel(paper); setPlan(null); setLoading(true);
    try{
      const r=await fetch('/api/code/generate',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({paper_id:paper.id,db_id:paper.db_id,mode:'project_plan',use_memory:true})});
      const d=await r.json();
      setPlan(d.ok?d.code:'Error: '+(d.detail||'unknown'));
    } catch(e){ setPlan('Server not reachable. Run ./start.sh'); }
    finally{ setLoading(false); }
  };
  return (
    <div className="page fade-in">
      <PageHead crumb="Build" title="Project Builder"
        sub="Turn any paper into a reproduction plan, code skeleton, dataset checklist, and 1-week roadmap."/>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1.4fr',gap:20,alignItems:'start'}}>

                border:'1px solid '+(sel&&sel.id===p.id?'var(--accent)':'var(--d-border)'),

        <button className="btn" onClick={() => { setVisible(log.slice(0,8)); setLive(true); }}>
          <Icon name="reset" size={14}/> Replay
        </button>
        <button className={`btn${live?' btn-accent':''}`} onClick={() => setLive(l => !l)}>
          <span style={{width:7,height:7,borderRadius:'50%',background:live?'var(--d-bg)':'var(--accent)',display:'inline-block'}}/>
          {live ? 'Live' : 'Paused'}
        </button>
      </PageHead>

      {/* Pipeline progress bar */}
      <div style={{background:'var(--d-surface)',border:'1px solid var(--d-border)',borderRadius:'var(--radius-md)',padding:'16px 20px',marginBottom:20}}>
        <div style={{fontSize:11,fontFamily:'var(--font-mono)',letterSpacing:'.08em',color:'var(--d-text-3)',marginBottom:12}}>DAILY PIPELINE · 06:00 UTC RUN</div>
        <div style={{display:'flex',gap:0,alignItems:'center'}}>
          {stages.map((s,i) => (
            <React.Fragment key={s.name}>
              <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:4}}>
                <div style={{width:32,height:32,borderRadius:'50%',border:`2px solid ${s.done?'var(--accent)':'var(--d-border)'}`,background:s.done?'color-mix(in srgb,var(--accent) 15%,transparent)':'var(--d-elev)',display:'flex',alignItems:'center',justifyContent:'center'}}>
                  {s.done ? <Icon name="check" size={13} stroke="var(--accent)"/> : <span style={{width:8,height:8,borderRadius:'50%',background:'var(--d-border)',display:'block'}}/>}
                </div>
                <span style={{fontSize:10,color:s.done?'var(--accent)':'var(--d-text-3)',fontFamily:'var(--font-mono)',whiteSpace:'nowrap'}}>{s.name}</span>
              </div>
              {i < stages.length-1 && <div style={{flex:1,height:2,background: stages[i+1].done?'var(--accent)':'var(--d-border)',margin:'0 4px',marginBottom:18,transition:'background .4s'}}/>}
            </React.Fragment>
          ))}
        </div>
      </div>

      {/* Agent filter */}
      <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:16}}>
        {AGENTS.slice(0,8).map(a => (
          <button key={a} className={`seg-btn${filter===a?' on':''}`} style={{fontSize:11,padding:'4px 10px'}} onClick={() => setFilter(a)}>
            {a === 'all' ? 'All agents' : a.replace('Agent','').replace('Analyzer','Analyst')}
          </button>
        ))}
      </div>

      {/* Event feed */}
      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        {filtered.map((ev, i) => {
          const meta = TYPE_META[ev.type] || {color:'var(--d-text-3)',label:ev.type};
          const isWarn = ev.status === 'warn';
          return (
            <div key={i} className="fade-in" style={{background:'var(--d-surface)',border:`1px solid ${isWarn?'rgba(242,96,125,.3)':'var(--d-border)'}`,borderRadius:'var(--radius-sm)',padding:'10px 14px',display:'flex',gap:12,alignItems:'flex-start'}}>
              <span style={{fontSize:11,fontFamily:'var(--font-mono)',color:'var(--d-text-3)',minWidth:60,paddingTop:2}}>{ev.ts}</span>
              <div style={{flex:1}}>
                <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:3,flexWrap:'wrap'}}>
                  <span style={{fontSize:12,fontWeight:600,color:'var(--d-text)',fontFamily:'var(--font-mono)'}}>{ev.from}</span>
                  <span style={{fontSize:11,color:'var(--d-text-3)'}}>→</span>
                  <span style={{fontSize:12,color:'var(--d-text-2)',fontFamily:'var(--font-mono)'}}>{ev.to}</span>
                  <span style={{fontSize:10,color:meta.color,background:`color-mix(in srgb, ${meta.color} 12%, transparent)`,border:`1px solid color-mix(in srgb, ${meta.color} 25%, transparent)`,padding:'1px 7px',borderRadius:999,marginLeft:4}}>{meta.label}</span>
                  {isWarn && <span style={{fontSize:10,color:'#f2607d',marginLeft:'auto'}}>⚑ Risk detected</span>}
                </div>
                <div style={{fontSize:13,color: isWarn?'#f2607d':'var(--d-text-2)',lineHeight:1.5}}>{ev.msg}</div>
              </div>
            </div>
          );
        })}
        {live && visible.length < log.length && (
          <div style={{display:'flex',gap:8,alignItems:'center',padding:'8px 14px',color:'var(--d-text-3)',fontSize:12}}>
            <div style={{width:8,height:8,borderRadius:'50%',background:'var(--accent)',animation:'pulse 1s infinite'}}/>
            Agent pipeline running…
          </div>
        )}
        <div ref={endRef}/>
      </div>
    </div>
  );
}

</script>

<!-- App root (routes + tweaks) -->
<script type="text/babel">
/* ===== FrontierOS Personal Graph — IndexedDB (browser-local) ===== */
const PG = (() => {
  const DB_NAME = 'frontieros_personal';
  const DB_VER  = 1;
  let db = null;

  async function open() {
    if (db) return db;
    return new Promise((res, rej) => {
      const req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = e => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains('interactions'))
          d.createObjectStore('interactions', { keyPath: 'key' });
        if (!d.objectStoreNames.contains('saved'))
          d.createObjectStore('saved', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('ignored'))
          d.createObjectStore('ignored', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('prefs'))
          d.createObjectStore('prefs', { keyPath: 'key' });
      };
      req.onsuccess = e => { db = e.target.result; res(db); };
      req.onerror   = () => rej(req.error);
    });
  }

  async function put(store, obj) {
    const d = await open();
    return new Promise((res, rej) => {
      const tx = d.transaction(store, 'readwrite');
      tx.objectStore(store).put(obj).onsuccess = e => res(e.target.result);
      tx.onerror = () => rej(tx.error);
    });
  }

  async function getAll(store) {
    const d = await open();
    return new Promise((res, rej) => {
      const tx  = d.transaction(store, 'readonly');
      const req = tx.objectStore(store).getAll();
      req.onsuccess = () => res(req.result);
      req.onerror   = () => rej(req.error);
    });
  }

  async function del(store, key) {
    const d = await open();
    return new Promise((res, rej) => {
      const tx = d.transaction(store, 'readwrite');
      tx.objectStore(store).delete(key).onsuccess = () => res();
      tx.onerror = () => rej(tx.error);
    });
  }

  return {
    savePaper:   p  => put('saved',    { id: p.id, title: p.title, cat: p.cat, ts: Date.now() }),
    ignorePaper: p  => put('ignored',  { id: p.id, ts: Date.now() }),
    logInteract: (paperId, type) => put('interactions', { key: `${paperId}:${type}`, paperId, type, ts: Date.now() }),
    getSaved:    ()  => getAll('saved'),
    getIgnored:  ()  => getAll('ignored'),
    getInteractions: () => getAll('interactions'),
    setPref:     (k,v) => put('prefs', { key: k, value: v }),
    getSavedIds: async () => (await getAll('saved')).map(x=>x.id),
    getIgnoredIds: async () => (await getAll('ignored')).map(x=>x.id),
  };
})();

// Sync compact context to server for recommendations
async function syncPersonalContext() {
  try {
    const [saved, ignored] = await Promise.all([PG.getSavedIds(), PG.getIgnoredIds()]);
    const interactions = (await PG.getInteractions()).slice(-20);
    await fetch('/api/near-my-work/rescan', { method: 'POST' }).catch(()=>{});
    window.__personalContext = { saved_paper_ids: saved, ignored_paper_ids: ignored,
      recent_interactions: interactions };
  } catch(e) {}
}

/* ===== FrontierOS — app root, routing, tweaks ===== */

const { useState, useEffect, useCallback } = React;

const ACCENTS = {
  'Signal green': { a: '#2fcf9e', d: '#66e0bb' },
  'Deep teal': { a: '#14b8a6', d: '#5eead4' },
  'Electric violet': { a: '#a78bfa', d: '#c4b5fd' },
  'Arctic cyan': { a: '#34d9e0', d: '#7eebf0' },
};

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "Signal green",
  "theme": "light",
  "display": "Space Grotesk",
  "density": "regular",
  "radius": 14
}/*EDITMODE-END*/;

function Toast({ msg }) {
  if (!msg) return null;
  return <div style={{ position: 'fixed', bottom: 26, left: '50%', transform: 'translateX(-50%)', background: 'var(--d-elev-2)', border: '1px solid var(--accent)', color: 'var(--d-text)', padding: '12px 20px', borderRadius: 999, fontSize: 14, zIndex: 200, boxShadow: '0 10px 30px rgba(0,0,0,.4)' }} className="fade-in"><Icon name="check" size={15} stroke="var(--accent)" /> {msg}</div>;
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [page, setPage] = useState('dashboard');
  const [paper, setPaper] = useState(null);
  const [activeCats, setActiveCats] = useState(['cs.CL', 'cs.AI', 'cs.LG', 'cs.CV']);
  const [toast, setToast] = useState('');
  const { CATS } = window.RR_DATA;

  // apply tweaks
  useEffect(() => {
    const ac = ACCENTS[t.accent] || ACCENTS['Signal green'];
    const r = document.documentElement.style;
    r.setProperty('--accent', ac.a);
    r.setProperty('--n-dataset', ac.a);
    document.body.classList.toggle('light', t.theme === 'light');
    r.setProperty('--font-display', `'${t.display}', 'Space Grotesk', sans-serif`);
    r.setProperty('--radius-md', t.radius + 'px');
    r.setProperty('--pad', t.density === 'compact' ? '14px' : t.density === 'comfy' ? '26px' : '20px');
  }, [t]);

  const flash = useCallback((m) => { setToast(m); setTimeout(() => setToast(''), 1900); }, []);
  const openPaper = useCallback((p) => { setPaper(p); setPage('deepdive'); window.scrollTo(0, 0); }, []);
  const goto = useCallback((pg) => { setPage(pg); window.scrollTo(0, 0); }, []);

  const onAction = useCallback((kind, p) => {
    if (kind === 'open') openPaper(p);
    else if (kind === 'code') { setPaper(p); goto('p2c'); }
    else if (kind === 'save') flash(`Added “${p.title.slice(0, 32)}…” to library`);
    else if (kind === 'compare') flash('Added to comparison tray');
  }, []);

  const toggleCat = (c) => setActiveCats(a => a.includes(c) ? a.filter(x => x !== c) : [...a, c]);

  const onSearch = (q) => { goto('memory'); flash('Asking research memory…'); };

  let view;
  switch (page) {
    case 'dashboard': view = <DashboardPage setPage={goto} onOpen={openPaper} onAction={onAction} />; break;
    case 'nearwork': view = <NearMyWorkPage onOpen={openPaper} setPage={goto} flash={flash} />; break;
    case 'context': view = <ResearchContextPage flash={flash} />; break;
    case 'directives': view = <DirectivesPage flash={flash} setPage={goto} />; break;
    case 'novelty': view = <NoveltyRadarPage onOpen={openPaper} setPage={goto} />; break;
    case 'related': view = <RelatedWorkPage onOpen={openPaper} flash={flash} />; break;
    case 'cite': view = <CitationAdvisorPage />; break;
    case 'daily': view = <DailyPapersPage onOpen={openPaper} onAction={onAction} activeCats={activeCats} />; break;
    case 'deepdive': view = <DeepDivePage paper={paper} onAction={onAction} setPage={goto} />; break;
    case 'memory': view = <MemoryPage />; break;
    case 'graph': view = <KnowledgeGraph />; break;
    case 'trends': view = <TrendRadarPage setPage={goto} />; break;
    case 'gaps': view = <GapsPage setPage={goto} />; break;
    case 'p2c': view = <PaperToCodePage />; break;
    case 'builder': view = <ProjectBuilderPage />; break;
    case 'reports': view = <ReportsPage />; break;
    case 'collections': view = <CollectionsPage />; break;
    case 'settings': view = <SettingsPage />; break;
    case 'threat': view = <ThreatPage onOpen={openPaper} setPage={goto} />; break;
    case 'labbrief': view = <LabBriefPage onOpen={openPaper} setPage={goto} />; break;
    case 'agentlog': view = <AgentLogPage />; break;
    default: view = <DashboardPage setPage={goto} onOpen={openPaper} onAction={onAction} />;
  }

  return (
    <div className="app-shell">
      <Sidebar page={page} setPage={goto} cats={CATS} activeCats={activeCats} toggleCat={toggleCat} />
      <div className="main">
        <Topbar onSearch={onSearch} />
        {view}
      </div>
      <Toast msg={toast} />

      <TweaksPanel>
        <TweakSection label="Theme" />
        <TweakColor label="Accent" value={(ACCENTS[t.accent] || {}).a}
          options={Object.values(ACCENTS).map(x => x.a)}
          onChange={(v) => { const name = Object.keys(ACCENTS).find(k => ACCENTS[k].a === v); setTweak('accent', name || 'Signal green'); }} />
        <TweakRadio label="Mode" value={t.theme} options={['dark', 'light']} onChange={(v) => setTweak('theme', v)} />
        <TweakSection label="Typography" />
        <TweakSelect label="Display font" value={t.display}
          options={['Space Grotesk', 'Hanken Grotesk', 'JetBrains Mono']} onChange={(v) => setTweak('display', v)} />
        <TweakSection label="Layout" />
        <TweakRadio label="Density" value={t.density} options={['compact', 'regular', 'comfy']} onChange={(v) => setTweak('density', v)} />
        <TweakSlider label="Card radius" value={t.radius} min={4} max={24} unit="px" onChange={(v) => setTweak('radius', v)} />
      </TweaksPanel>
    </div>
  );
}

// Wait for RR_DATA to be loaded by the async fetch above before mounting
function mountApp() {
  if (window.__RR_DATA_READY) {
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  } else {
    setTimeout(mountApp, 50);
  }
}
mountApp();

</script>

</body>
