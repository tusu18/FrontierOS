<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FrontierOS — Research Intelligence Terminal</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   FrontierOS — shared design system
   Light editorial (marketing) + dark terminal (app)
   ============================================================ */





















































:root {
  /* type */
  --font-display: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
  --font-body: 'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;

  /* light palette */
  --paper: #ffffff;
  --stone: #f1efe9;
  --stone-2: #e8e5dc;
  --ink: #14161a;
  --ink-soft: #3d4148;
  --ink-mute: #797f88;
  --hairline: #e3e0d8;
  --hairline-2: #d6d2c8;

  /* green identity */
  --green-950: #042b23;
  --green-900: #063f33;
  --green-800: #0a5645;
  --green-600: #0e8a6c;
  --green-700: #0b755e;
  --green-500: #14a883;
  --green-400: #2fcf9e;
  --green-300: #66e0bb;
  --green-100: #c8f3e3;
  --green-050: #e9faf3;

  /* warm + functional accents */
  --coral: #ff7759;
  --coral-soft: #ffcabb;
  --blue: #2f6df0;
  --amber: #f4a52a;
  --rose: #f2607d;

  /* dark terminal palette */
  --d-bg: #0a0f0d;
  --d-bg-2: #0d1411;
  --d-surface: #111a16;
  --d-elev: #16221c;
  --d-elev-2: #1c2b24;
  --d-border: #25342c;
  --d-border-2: #2f4238;
  --d-text: #eaf2ed;
  --d-text-2: #9fb0a7;
  --d-text-3: #6a7c73;
  --d-topbar: rgba(10,15,13,.82);
  --d-legend: rgba(13,20,17,.9);

  /* node taxonomy colors (graph) */
  --n-paper: #5b9bff;
  --n-method: #a78bfa;
  --n-dataset: #2fcf9e;
  --n-benchmark: #34d9e0;
  --n-claim: #f4cf4a;
  --n-limitation: #f2607d;
  --n-future: #f4a52a;
  --n-gap: #ff8fc7;
  --n-author: #9aa6b2;
  --n-inst: #d8dee6;

  --radius-xs: 4px;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 22px;
  --radius-pill: 999px;

  --shadow-soft: 0 1px 2px rgba(8,20,16,.04), 0 12px 30px rgba(8,20,16,.06);
}

* { box-sizing: border-box; }
html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
body { margin: 0; font-family: var(--font-body); }

/* ---- shared primitives ---- */
.mono-label {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: .14em;
  text-transform: uppercase;
}

.pill-cta {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--font-body); font-weight: 500; font-size: 15px;
  padding: 13px 24px; border-radius: var(--radius-pill);
  border: 1px solid transparent; cursor: pointer; text-decoration: none;
  transition: transform .15s ease, background .2s ease, color .2s ease, border-color .2s ease;
}
.pill-cta:active { transform: translateY(1px); }

.pill-dark { background: var(--ink); color: #fff; }
.pill-dark:hover { background: #000; }
.pill-green { background: var(--green-900); color: #eafaf4; }
.pill-green:hover { background: var(--green-800); }
.pill-light { background: #fff; color: var(--ink); border-color: var(--hairline-2); }
.pill-light:hover { background: var(--stone); }
.pill-ghost { background: transparent; color: var(--ink); }
.pill-ghost:hover { background: rgba(0,0,0,.04); }

.link-underline {
  color: var(--ink); text-decoration: none; font-weight: 500;
  border-bottom: 1px solid var(--ink); padding-bottom: 1px;
  transition: opacity .2s ease;
}
.link-underline:hover { opacity: .55; }

::selection { background: var(--green-300); color: var(--green-950); }

/* FrontierOS — dark terminal app shell */

body.app { background: var(--d-bg); color: var(--d-text); font-family: var(--font-body); }
#root { min-height: 100vh; }

.app-shell { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }

/* ---------- Sidebar ---------- */
.sidebar {
  background: var(--d-bg-2); border-right: 1px solid var(--d-border);
  display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.sb-brand { display: flex; align-items: center; gap: 10px; padding: 20px 20px 18px; font-family: var(--font-display); font-weight: 600; font-size: 17px; letter-spacing: -.02em; }
.sb-brand .mark { width: 26px; height: 26px; }
.sb-section { padding: 6px 12px; }
.sb-section + .sb-section { border-top: 1px solid var(--d-border); margin-top: 6px; padding-top: 12px; }
.sb-cap { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--d-text-3); padding: 6px 10px; }
.nav-item {
  display: flex; align-items: center; gap: 11px; padding: 9px 11px; border-radius: 9px;
  color: var(--d-text-2); font-size: 14px; cursor: pointer; transition: background .15s, color .15s;
  border: 1px solid transparent; width: 100%; text-align: left; background: none; font-family: inherit;
}
.nav-item:hover { background: var(--d-elev); color: var(--d-text); }
.nav-item.active { background: var(--d-elev-2); color: var(--d-text); border-color: var(--d-border-2); }
.nav-item.active .ni-ic { color: var(--accent); }
.ni-ic { width: 17px; height: 17px; display: grid; place-items: center; color: var(--d-text-3); flex-shrink: 0; }
.nav-item.active .ni-ic svg, .nav-item:hover .ni-ic svg { stroke: currentColor; }

.sb-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 10px 10px; }
.cat-chip { font-family: var(--font-mono); font-size: 11px; padding: 3px 9px; border-radius: var(--radius-pill); border: 1px solid var(--d-border-2); color: var(--d-text-2); cursor: pointer; transition: all .15s; }
.cat-chip:hover { border-color: var(--accent); color: var(--accent); }
.cat-chip.on { background: var(--accent); color: #042b23; border-color: var(--accent); }

.sb-profile { margin-top: auto; padding: 14px 16px; border-top: 1px solid var(--d-border); display: flex; align-items: center; gap: 11px; }
.sb-profile .av { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg,var(--green-500),var(--green-800)); display: grid; place-items: center; color: #042b23; font-weight: 600; font-size: 14px; }
.sb-profile .who { font-size: 13px; }
.sb-profile .who b { display: block; color: var(--d-text); font-weight: 600; }
.sb-profile .who span { color: var(--d-text-3); font-size: 11.5px; }

/* ---------- Topbar ---------- */
.main { display: flex; flex-direction: column; min-width: 0; }
.topbar {
  height: 64px; border-bottom: 1px solid var(--d-border); display: flex; align-items: center;
  gap: 16px; padding: 0 28px; position: sticky; top: 0; background: var(--d-topbar);
  backdrop-filter: blur(12px); z-index: 30;
}
.global-search {
  flex: 1; max-width: 620px; display: flex; align-items: center; gap: 10px;
  background: var(--d-surface); border: 1px solid var(--d-border); border-radius: var(--radius-pill);
  padding: 9px 16px; color: var(--d-text-3); cursor: text; transition: border-color .15s;
}
.global-search:focus-within { border-color: var(--accent); }
.global-search input { flex: 1; background: none; border: none; outline: none; color: var(--d-text); font-family: inherit; font-size: 13.5px; }
.global-search input::placeholder { color: var(--d-text-3); }
.global-search kbd { font-family: var(--font-mono); font-size: 10px; background: var(--d-elev); border: 1px solid var(--d-border-2); border-radius: 5px; padding: 2px 6px; color: var(--d-text-2); }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
.model-badge { display: flex; align-items: center; gap: 7px; font-family: var(--font-mono); font-size: 11.5px; color: var(--d-text-2); background: var(--d-surface); border: 1px solid var(--d-border); border-radius: var(--radius-pill); padding: 6px 12px; }
.model-badge .led { width: 7px; height: 7px; border-radius: 50%; background: var(--green-400); box-shadow: 0 0 8px var(--green-400); }
.top-date { font-family: var(--font-mono); font-size: 11.5px; color: var(--d-text-3); }
.icon-btn { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--d-border); background: var(--d-surface); color: var(--d-text-2); display: grid; place-items: center; cursor: pointer; transition: all .15s; }
.icon-btn:hover { color: var(--d-text); border-color: var(--d-border-2); }

/* ---------- Page canvas ---------- */
.page { padding: 32px 28px 60px; max-width: 1280px; width: 100%; margin: 0 auto; }
.page.wide { max-width: 100%; }
.page-head { margin-bottom: 26px; }
.page-head .crumb { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
.page-head h1 { font-family: var(--font-display); font-weight: 500; font-size: 34px; letter-spacing: -.025em; margin: 0; }
.page-head p { color: var(--d-text-2); font-size: 15.5px; margin: 10px 0 0; max-width: 70ch; line-height: 1.5; }

/* generic card */
.card { background: var(--d-surface); border: 1px solid var(--d-border); border-radius: var(--radius-md); }
.card-pad { padding: var(--pad, 20px); }

/* badges */
.badge { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase; padding: 4px 9px; border-radius: var(--radius-pill); border: 1px solid; }
.badge-green { background: rgba(47,207,158,.13); color: var(--green-300); border-color: rgba(47,207,158,.32); }
.badge-purple { background: rgba(167,139,250,.13); color: #c4b5fd; border-color: rgba(167,139,250,.32); }
.badge-cyan { background: rgba(52,217,224,.12); color: #8be8ee; border-color: rgba(52,217,224,.3); }
.badge-orange { background: rgba(244,165,42,.13); color: #f7c66a; border-color: rgba(244,165,42,.32); }
.badge-rose { background: rgba(242,96,125,.13); color: #f59ab0; border-color: rgba(242,96,125,.32); }
.badge-blue { background: rgba(91,155,255,.13); color: #9cc1ff; border-color: rgba(91,155,255,.32); }
.badge-gray { background: rgba(154,166,178,.1); color: #aab4be; border-color: rgba(154,166,178,.26); }

/* score pill */
.score { display: inline-flex; align-items: baseline; gap: 6px; font-family: var(--font-mono); font-size: 12px; color: var(--d-text-2); background: var(--d-elev); border: 1px solid var(--d-border); border-radius: var(--radius-pill); padding: 4px 11px; }
.score b { color: var(--d-text); font-weight: 600; font-size: 13px; }
.score.hi b { color: var(--green-300); }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 7px; font-family: var(--font-body); font-size: 13px; font-weight: 500; padding: 8px 15px; border-radius: 9px; cursor: pointer; border: 1px solid var(--d-border-2); background: var(--d-elev); color: var(--d-text); transition: all .15s; }
.btn:hover { background: var(--d-elev-2); border-color: var(--accent); }
.btn-accent { background: var(--accent); color: #042b23; border-color: var(--accent); font-weight: 600; }
.btn-accent:hover { filter: brightness(1.08); background: var(--accent); }
.btn-ghost { background: transparent; }
.btn-sm { padding: 6px 11px; font-size: 12px; }

/* KPI cards */
.kpi-grid { display: grid; grid-template-columns: repeat(6,1fr); gap: 14px; }
@media (max-width:1100px){ .kpi-grid { grid-template-columns: repeat(3,1fr); } }
@media (max-width:620px){ .kpi-grid { grid-template-columns: repeat(2,1fr); } }
.kpi { padding: 16px; }
.kpi .k-top { display: flex; justify-content: space-between; align-items: flex-start; }
.kpi .k-label { font-size: 12px; color: var(--d-text-2); }
.kpi .k-val { font-family: var(--font-display); font-size: 30px; font-weight: 500; letter-spacing: -.02em; margin: 8px 0 4px; }
.kpi .k-delta { font-family: var(--font-mono); font-size: 11px; }
.k-delta.up { color: var(--green-300); }
.k-delta.down { color: var(--rose); }
.spark { display: block; margin-top: 8px; }

/* hero block (dashboard) */
.cmd-hero { background: linear-gradient(135deg, var(--d-surface), var(--d-bg-2)); border: 1px solid var(--d-border); border-radius: var(--radius-lg); padding: 30px 32px; position: relative; overflow: hidden; }
.cmd-hero::after { content:''; position:absolute; inset:0; background: radial-gradient(70% 140% at 100% 0%, rgba(47,207,158,.1), transparent 55%); pointer-events:none; }
.cmd-hero h2 { font-family: var(--font-display); font-weight: 500; font-size: 27px; letter-spacing: -.02em; margin: 0; max-width: 26ch; }
.cmd-hero p { color: var(--d-text-2); margin: 12px 0 22px; max-width: 60ch; }
.cmd-hero .status { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--d-border); }
.cmd-hero .status div { font-family: var(--font-mono); font-size: 12px; color: var(--d-text-3); }
.cmd-hero .status b { color: var(--d-text); display: block; font-size: 15px; margin-top: 3px; }

/* intel strip */
.intel-strip { display: grid; grid-template-columns: repeat(6,1fr); gap: 12px; }
@media (max-width:1100px){ .intel-strip { grid-template-columns: repeat(3,1fr);} }
@media (max-width:620px){ .intel-strip { grid-template-columns: repeat(2,1fr);} }
.intel { padding: 15px; border-left: 2px solid var(--accent); }
.intel .ik { font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--d-text-3); }
.intel .iv { font-family: var(--font-display); font-weight: 500; font-size: 16px; margin-top: 8px; letter-spacing: -.01em; line-height: 1.2; }

.section-title { font-family: var(--font-display); font-weight: 500; font-size: 18px; letter-spacing: -.01em; margin: 0 0 14px; display:flex; align-items:center; gap:10px; }
.section-title .count { font-family: var(--font-mono); font-size: 12px; color: var(--d-text-3); font-weight: 400; }

/* paper card */
.paper-card { padding: 20px; transition: border-color .15s, transform .15s; cursor: pointer; }
.paper-card:hover { border-color: var(--d-border-2); transform: translateY(-2px); }
.paper-card .pc-badges { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 13px; }
.paper-card h3 { font-family: var(--font-display); font-weight: 500; font-size: 18px; letter-spacing: -.015em; margin: 0 0 9px; line-height: 1.25; }
.paper-card .pc-sum { color: var(--d-text-2); font-size: 14px; line-height: 1.5; margin: 0 0 14px; }
.paper-card .pc-meta { font-family: var(--font-mono); font-size: 11.5px; color: var(--d-text-3); margin-bottom: 14px; }
.paper-card .pc-scores { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
.paper-card .pc-tax { font-size: 12.5px; color: var(--d-text-3); margin-bottom: 6px; }
.paper-card .pc-tax b { color: var(--d-text-2); font-weight: 500; }
.paper-card .pc-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--d-border); }

/* controls bar */
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 22px; }
.search-field { display: flex; align-items: center; gap: 8px; background: var(--d-surface); border: 1px solid var(--d-border); border-radius: 9px; padding: 8px 13px; flex: 1; min-width: 200px; }
.search-field input { background: none; border: none; outline: none; color: var(--d-text); font-family: inherit; font-size: 13.5px; flex: 1; }
.search-field input::placeholder { color: var(--d-text-3); }
select.ctl, .toggle-chip { font-family: var(--font-body); font-size: 13px; background: var(--d-surface); border: 1px solid var(--d-border); border-radius: 9px; padding: 8px 13px; color: var(--d-text); cursor: pointer; }
select.ctl:hover { border-color: var(--d-border-2); }
.toggle-chip { display: inline-flex; align-items: center; gap: 7px; user-select: none; }
.toggle-chip .sw { width: 30px; height: 17px; border-radius: 999px; background: var(--d-border-2); position: relative; transition: background .15s; }
.toggle-chip .sw::after { content:''; position:absolute; top:2px; left:2px; width:13px; height:13px; border-radius:50%; background:#fff; transition: transform .15s; }
.toggle-chip.on .sw { background: var(--accent); }
.toggle-chip.on .sw::after { transform: translateX(13px); }

/* two-col */
.split { display: grid; grid-template-columns: 1fr 320px; gap: 20px; align-items: start; }
@media (max-width:980px){ .split { grid-template-columns: 1fr; } }

/* tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--d-border); margin-bottom: 22px; overflow-x: auto; }
.tab { font-family: var(--font-body); font-size: 13.5px; color: var(--d-text-2); padding: 11px 14px; cursor: pointer; border: none; background: none; border-bottom: 2px solid transparent; white-space: nowrap; transition: color .15s; }
.tab:hover { color: var(--d-text); }
.tab.active { color: var(--d-text); border-bottom-color: var(--accent); }

/* table */
table.rr { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.rr th { text-align: left; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--d-text-3); padding: 10px 12px; border-bottom: 1px solid var(--d-border); font-weight: 400; }
table.rr td { padding: 12px; border-bottom: 1px solid var(--d-border); color: var(--d-text-2); vertical-align: top; }
table.rr tr:hover td { background: var(--d-bg-2); }
table.rr td b { color: var(--d-text); font-weight: 500; }

/* trend card */
.trend-card { padding: 18px; }
.trend-card h4 { font-family: var(--font-display); font-weight: 500; font-size: 17px; margin: 0 0 12px; letter-spacing: -.01em; display:flex; justify-content:space-between; align-items:center; }
.vel { font-family: var(--font-mono); font-size: 13px; font-weight: 600; }
.vel.up { color: var(--green-300); }
.vel.down { color: var(--rose); }
.trend-row { display: flex; justify-content: space-between; font-size: 12.5px; padding: 5px 0; color: var(--d-text-3); }
.trend-row b { color: var(--d-text-2); font-weight: 500; }

/* gap card */
.gap-card { padding: 22px; }
.gap-card .opp { font-family: var(--font-display); font-size: 30px; font-weight: 500; color: var(--accent); }

/* chat / memory */
.chat-wrap { max-width: 820px; margin: 0 auto; }
.chips-row { display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 24px; }
.prompt-chip { font-size: 13px; color: var(--d-text-2); background: var(--d-surface); border: 1px solid var(--d-border); border-radius: var(--radius-pill); padding: 8px 14px; cursor: pointer; transition: all .15s; }
.prompt-chip:hover { border-color: var(--accent); color: var(--d-text); }
.msg { margin-bottom: 22px; }
.msg .role { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--d-text-3); margin-bottom: 8px; }
.msg.user .bubble { background: var(--d-elev); border: 1px solid var(--d-border); border-radius: var(--radius-md); padding: 14px 18px; font-size: 15px; }
.msg.ai .bubble { font-size: 15px; line-height: 1.6; color: var(--d-text); }
.msg.ai .bubble p { margin: 0 0 12px; }
.msg.ai .ev { background: var(--d-surface); border: 1px solid var(--d-border); border-left: 2px solid var(--accent); border-radius: 0 9px 9px 0; padding: 11px 15px; margin: 10px 0; font-size: 13.5px; color: var(--d-text-2); }
.msg.ai .cite { font-family: var(--font-mono); font-size: 11px; color: var(--accent); cursor: pointer; }
.cursor-blink::after { content:'▋'; color: var(--accent); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.composer { display: flex; gap: 10px; align-items: center; background: var(--d-surface); border: 1px solid var(--d-border-2); border-radius: var(--radius-pill); padding: 10px 12px 10px 20px; position: sticky; bottom: 20px; }
.composer input { flex: 1; background: none; border: none; outline: none; color: var(--d-text); font-family: inherit; font-size: 15px; }
.composer .send-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: #042b23; border: none; cursor: pointer; display: grid; place-items: center; font-size: 17px; }

/* empty / stub */
.stub { display: grid; place-items: center; min-height: 50vh; text-align: center; }
.stub .stub-ic { width: 64px; height: 64px; border-radius: 16px; border: 1px solid var(--d-border-2); display: grid; place-items: center; color: var(--accent); margin: 0 auto 22px; }
.stub h2 { font-family: var(--font-display); font-weight: 500; font-size: 24px; margin: 0 0 10px; letter-spacing: -.02em; }
.stub p { color: var(--d-text-2); max-width: 46ch; margin: 0 auto 22px; line-height: 1.55; }
.stub .feats { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.stub .feats span { font-family: var(--font-mono); font-size: 11.5px; color: var(--d-text-3); border: 1px solid var(--d-border); border-radius: var(--radius-pill); padding: 6px 13px; }

/* knowledge graph */
.graph-stage { background: var(--d-bg-2); border: 1px solid var(--d-border); border-radius: var(--radius-md); position: relative; overflow: hidden; height: 620px; cursor: grab; }
.graph-stage:active { cursor: grabbing; }
.graph-stage svg { display: block; width: 100%; height: 100%; }
.gnode { cursor: pointer; }
.gnode text { font-family: var(--font-body); font-size: 11px; fill: var(--d-text-2); pointer-events: none; }
.glink { stroke: var(--d-border-2); stroke-width: 1; }
.graph-legend { position: absolute; left: 14px; bottom: 14px; background: var(--d-legend); border: 1px solid var(--d-border); border-radius: 10px; padding: 12px 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 5px 18px; }
.graph-legend .lg { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--d-text-2); }
.graph-legend .lg i { width: 9px; height: 9px; border-radius: 50%; display: block; }
.graph-tools { position: absolute; right: 14px; top: 14px; display: flex; flex-direction: column; gap: 6px; }
.entity-panel { padding: 20px; }
.entity-panel .etype { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .1em; }
.entity-panel h3 { font-family: var(--font-display); font-weight: 500; font-size: 21px; letter-spacing: -.01em; margin: 10px 0 16px; }
.entity-stat { display: flex; justify-content: space-between; padding: 9px 0; border-top: 1px solid var(--d-border); font-size: 13px; color: var(--d-text-3); }
.entity-stat b { color: var(--d-text); font-weight: 500; }

/* bar chart (trends) */
.barchart { display: flex; flex-direction: column; gap: 11px; }
.bc-row { display: grid; grid-template-columns: 160px 1fr 50px; align-items: center; gap: 12px; font-size: 13px; }
.bc-row .bc-label { color: var(--d-text-2); }
.bc-track { height: 9px; background: var(--d-elev); border-radius: 999px; overflow: hidden; }
.bc-fill { height: 100%; border-radius: 999px; background: var(--accent); }
.bc-val { font-family: var(--font-mono); font-size: 12px; color: var(--d-text-2); text-align: right; }

/* scatter */
.scatter { position: relative; height: 320px; border: 1px solid var(--d-border); border-radius: var(--radius-md); background: var(--d-bg-2); margin-top: 8px; }
.sc-pt { position: absolute; width: 12px; height: 12px; border-radius: 50%; transform: translate(-50%,50%); cursor: pointer; transition: transform .15s; }
.sc-pt:hover { transform: translate(-50%,50%) scale(1.5); }
.sc-axis { position: absolute; font-family: var(--font-mono); font-size: 10px; color: var(--d-text-3); }

/* fade in — transform-only so content stays visible even if the animation
   timeline is paused (e.g. a backgrounded iframe never advances past frame 0) */
.fade-in { animation: fadeIn .42s cubic-bezier(.22,.61,.36,1) both; }
@keyframes fadeIn { from { transform: translateY(10px); } to { transform: none; } }

/* ============================================================
   LIGHT THEME — redefine the dark token set to light values so
   every component that uses --d-* adapts automatically.
   Warm editorial palette matching the marketing site.
   ============================================================ */
body.app.light {
  --d-bg: #f3f1ea;
  --d-bg-2: #ffffff;
  --d-surface: #ffffff;
  --d-elev: #f4f2ec;
  --d-elev-2: #ebe8df;
  --d-border: #e4e1d8;
  --d-border-2: #d4d0c5;
  --d-text: #16181c;
  --d-text-2: #51565e;
  --d-text-3: #8a8f97;
  --d-topbar: rgba(255,255,255,.82);
  --d-legend: rgba(255,255,255,.94);
  background: var(--d-bg); color: var(--d-text);
}
/* light-mode component nudges */
body.app.light .sidebar { background: #fbfaf6; }
body.app.light .cmd-hero { background: linear-gradient(135deg, #ffffff, #f4f2ec); }
body.app.light .cmd-hero::after { background: radial-gradient(70% 140% at 100% 0%, rgba(20,168,131,.10), transparent 55%); }
body.app.light .btn-accent { color: #04372b; }
body.app.light .badge-green { background: rgba(14,138,108,.12); color: #0a6e54; border-color: rgba(14,138,108,.28); }
body.app.light .badge-purple { background: rgba(124,92,246,.1); color: #6a44d8; border-color: rgba(124,92,246,.26); }
body.app.light .badge-cyan { background: rgba(20,160,180,.1); color: #0c7e8e; border-color: rgba(20,160,180,.26); }
body.app.light .badge-orange { background: rgba(220,140,20,.12); color: #b06a06; border-color: rgba(220,140,20,.28); }
body.app.light .badge-rose { background: rgba(220,70,100,.1); color: #c23a5c; border-color: rgba(220,70,100,.26); }
body.app.light .badge-blue { background: rgba(40,110,230,.1); color: #2059c8; border-color: rgba(40,110,230,.26); }
body.app.light .badge-gray { background: rgba(90,96,104,.08); color: #5a6068; border-color: rgba(90,96,104,.2); }
body.app.light .score.hi b { color: #0a7e5f; }
body.app.light .sb-profile .av { color: #f3f1ea; }
body.app.light .topbar .model-badge .led { box-shadow: 0 0 8px var(--green-500); }
body.app.light .card { box-shadow: 0 1px 2px rgba(20,30,24,.03), 0 1px 0 rgba(20,30,24,.02); }
body.app.light .paper-card:hover, body.app.light .card:hover { box-shadow: 0 6px 24px rgba(20,30,24,.07); }
body.app.light table.rr tr:hover td { background: #faf9f5; }
body.app.light .composer { box-shadow: 0 8px 30px rgba(20,30,24,.08); }
body.app.light .graph-stage { background: #fbfaf6; }
body.app.light .glink { stroke: var(--d-border-2); }
body.app.light .gnode text { fill: var(--d-text-2); }

/* theme toggle is instant (no background/color transition) so the change is
   always correct even in a backgrounded iframe where transitions freeze.
   Keep a subtle box-shadow ease for hover polish only. */
body.app .card, body.app .btn { transition: box-shadow .25s ease, transform .2s ease; }

/* ============================================================
   CONTEXT ENGINE — Near My Work, Context, Directives,
   Novelty Radar, Living Related Work, Citation Advisor
   ============================================================ */

/* grouped sidebar nav */
.sb-nav { display: flex; flex-direction: column; gap: 2px; }
.nav-group { padding-bottom: 8px; margin-bottom: 6px; }
.nav-group + .nav-group { border-top: 1px solid var(--d-border); padding-top: 10px; }
.nav-group-cap { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .15em; text-transform: uppercase; color: var(--d-text-3); padding: 4px 11px 7px; }
.ni-tag { margin-left: auto; font-family: var(--font-mono); font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: #042b23; background: var(--accent); border-radius: 5px; padding: 2px 6px; font-weight: 600; }
body.app.light .ni-tag { color: #04372b; }

/* claim bar */
.ctx-claimbar { display: flex; gap: 14px; align-items: flex-start; background: var(--d-surface); border: 1px solid var(--d-border); border-left: 3px solid var(--accent); border-radius: var(--radius-md); padding: 16px 18px; margin-bottom: 22px; }
.ccb-ic { width: 36px; height: 36px; border-radius: 9px; background: color-mix(in srgb, var(--accent) 14%, transparent); display: grid; place-items: center; flex: none; }
.ccb-cap { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--d-text-3); margin-bottom: 5px; }
.ccb-claim { font-size: 14.5px; color: var(--d-text); line-height: 1.5; max-width: 90ch; }

/* segmented filter */
.seg-filter { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 20px; }
.seg-btn { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-body); font-size: 13px; color: var(--d-text-2); background: var(--d-surface); border: 1px solid var(--d-border); border-radius: var(--radius-pill); padding: 7px 14px; cursor: pointer; transition: border-color .15s, color .15s; }
.seg-btn:hover { border-color: var(--d-border-2); color: var(--d-text); }
.seg-btn.on { background: var(--d-elev-2); color: var(--d-text); border-color: var(--accent); }
.seg-n { font-family: var(--font-mono); font-size: 11px; color: var(--d-text-3); background: var(--d-elev); border-radius: 999px; padding: 1px 7px; }
.seg-btn.on .seg-n { color: var(--accent); }

/* ring */
.ring-wrap { position: relative; flex: none; }
.ring-num { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring-num b { font-family: var(--font-display); font-weight: 600; font-size: 19px; color: var(--d-text); line-height: 1; }
.ring-num span { font-family: var(--font-mono); font-size: 8.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--d-text-3); margin-top: 2px; }

/* classification badge */
.cls-badge { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .03em; text-transform: uppercase; border: 1px solid; border-radius: var(--radius-pill); padding: 4px 11px; font-weight: 500; }
.cls-badge.sm { font-size: 10px; padding: 3px 9px; }

/* near-my-work cards */
.nmw-list { display: flex; flex-direction: column; gap: 14px; }
.nmw-card { background: var(--d-surface); border: 1px solid var(--d-border); border-radius: var(--radius-md); overflow: hidden; transition: border-color .15s, box-shadow .2s; }
.nmw-card:hover { border-color: var(--d-border-2); }
.nmw-card.open { border-color: var(--accent); }
.nmw-top { display: flex; gap: 18px; align-items: flex-start; padding: 18px 20px; cursor: pointer; }
.nmw-mid { flex: 1; min-width: 0; }
.nmw-badges { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 9px; }
.act-pill { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--d-text-2); background: var(--d-elev); border: 1px solid var(--d-border); border-radius: var(--radius-pill); padding: 4px 10px; }
.nmw-mid h3 { font-family: var(--font-display); font-weight: 500; font-size: 18px; letter-spacing: -.015em; margin: 0 0 6px; line-height: 1.25; }
.nmw-meta { font-family: var(--font-mono); font-size: 11.5px; color: var(--d-text-3); margin-bottom: 9px; }
.nmw-note { font-size: 14px; color: var(--d-text-2); line-height: 1.5; margin: 0; max-width: 80ch; }
.nmw-exp { flex: none; width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--d-border); background: var(--d-elev); color: var(--d-text-3); display: grid; place-items: center; cursor: pointer; transition: transform .2s; }
.nmw-card.open .nmw-exp { transform: rotate(90deg); color: var(--accent); border-color: var(--accent); }
.nmw-detail { border-top: 1px solid var(--d-border); padding: 20px; background: var(--d-bg-2); }
.nmw-cols { display: grid; grid-template-columns: 1fr 1.1fr; gap: 28px; }
@media (max-width: 820px){ .nmw-cols { grid-template-columns: 1fr; gap: 18px; } }
.mini-cap { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--d-text-3); margin-bottom: 12px; }
.nmw-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }

/* overlap bars */
.ov-list { display: flex; flex-direction: column; gap: 11px; }
.ov-row { display: grid; grid-template-columns: 92px 1fr 38px; align-items: center; gap: 12px; }
.ov-dim { font-size: 13px; color: var(--d-text-2); }
.ov-track { height: 7px; border-radius: 999px; background: var(--d-elev); overflow: hidden; }
.ov-fill { height: 100%; border-radius: 999px; background: var(--accent); transition: width .8s cubic-bezier(.22,.61,.36,1); }
.ov-pct { font-family: var(--font-mono); font-size: 12px; color: var(--d-text-2); text-align: right; }

/* evidence + uncertainty */
.evidence { background: var(--d-surface); border: 1px solid var(--d-border); border-left: 2px solid var(--accent); border-radius: 0 9px 9px 0; padding: 13px 15px; }
.ev-quote { font-size: 13.5px; color: var(--d-text); line-height: 1.5; font-style: italic; display: flex; gap: 8px; }
.ev-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 11px; }
.conf-pill { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11px; border: 1px solid; border-radius: var(--radius-pill); padding: 3px 10px; }
.conf-dot { width: 6px; height: 6px; border-radius: 50%; }
.ev-unc { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--d-text-3); }
.ev-src { font-family: var(--font-mono); font-size: 11px; color: var(--d-text-3); margin-left: auto; }

/* research context page */
.ctx-grid { display: grid; grid-template-columns: 1fr 300px; gap: 22px; }
@media (max-width: 980px){ .ctx-grid { grid-template-columns: 1fr; } }
.ctx-side { display: flex; flex-direction: column; gap: 14px; }
.upload-zone { border: 1.5px dashed var(--d-border-2); border-radius: var(--radius-md); padding: 32px 24px; text-align: center; cursor: pointer; transition: border-color .2s, background .2s; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.upload-zone:hover, .upload-zone.drag { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, transparent); }
.uz-ic { width: 52px; height: 52px; border-radius: 13px; background: color-mix(in srgb, var(--accent) 12%, transparent); display: grid; place-items: center; margin-bottom: 4px; }
.upload-zone b { font-family: var(--font-display); font-weight: 500; font-size: 16px; color: var(--d-text); }
.upload-zone span { font-size: 13px; color: var(--d-text-3); max-width: 46ch; }
.ctx-items { display: flex; flex-direction: column; gap: 9px; }
.ctx-item { display: flex; gap: 13px; align-items: center; background: var(--d-surface); border: 1px solid var(--d-border); border-radius: var(--radius-sm); padding: 13px 15px; transition: border-color .15s; }
.ctx-item:hover { border-color: var(--d-border-2); }
.ctx-item.fresh { border-color: var(--accent); animation: ctxIn .5s ease; }
@keyframes ctxIn { from { transform: translateY(-6px); } to { transform: none; } }
.ci-ic { width: 34px; height: 34px; border-radius: 9px; background: var(--d-elev); color: var(--accent); display: grid; place-items: center; flex: none; }
.ci-body { flex: 1; min-width: 0; }
.ci-name { font-size: 14px; color: var(--d-text); font-weight: 500; display: flex; align-items: center; gap: 9px; }
.ci-type { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--d-text-3); border: 1px solid var(--d-border); border-radius: 5px; padding: 1px 6px; }
.ci-topics { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.ci-topics span { font-family: var(--font-mono); font-size: 10.5px; color: var(--d-text-2); background: var(--d-elev); border-radius: 5px; padding: 2px 7px; }
.ci-meta { font-family: var(--font-mono); font-size: 11px; color: var(--d-text-3); text-align: right; flex: none; line-height: 1.5; }
.ent-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.ent-cell { background: var(--d-elev); border: 1px solid var(--d-border); border-radius: 9px; padding: 11px 12px; }
.ent-cell b { font-family: var(--font-display); font-weight: 600; font-size: 22px; color: var(--d-text); display: block; line-height: 1; }
.ent-cell span { font-size: 11px; color: var(--d-text-3); margin-top: 4px; display: block; }
.overlap-meter { height: 9px; border-radius: 999px; background: var(--d-elev); overflow: hidden; margin-bottom: 12px; }
.om-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 40%, transparent)); }
.side-note { font-size: 12.5px; color: var(--d-text-2); line-height: 1.55; margin: 0; }
.side-note b { color: var(--d-text); }
.privacy-card { display: flex; gap: 12px; align-items: flex-start; }
.privacy-card p { font-size: 12.5px; color: var(--d-text-2); line-height: 1.55; margin: 0; }

/* directives */
.hit-pill, .fresh-pill { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 12px; color: var(--d-text-2); background: var(--d-surface); border: 1px solid var(--d-border); border-radius: var(--radius-pill); padding: 7px 13px; }
.hit-pill .led, .fresh-pill .led { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
.dir-compose { display: flex; align-items: center; gap: 11px; background: var(--d-surface); border: 1px solid var(--d-border-2); border-radius: var(--radius-pill); padding: 9px 12px 9px 18px; margin-bottom: 12px; }
.dir-compose input { flex: 1; background: none; border: none; outline: none; color: var(--d-text); font-family: inherit; font-size: 14.5px; }
.dir-compose input::placeholder { color: var(--d-text-3); }
.dir-templates { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
.tmpl-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--d-text-2); background: var(--d-surface); border: 1px dashed var(--d-border-2); border-radius: var(--radius-pill); padding: 6px 12px; cursor: pointer; transition: border-color .15s, color .15s; }
.tmpl-chip:hover { border-color: var(--accent); color: var(--accent); border-style: solid; }
.dir-list { display: flex; flex-direction: column; gap: 10px; }
.dir-card { display: flex; align-items: center; gap: 15px; background: var(--d-surface); border: 1px solid var(--d-border); border-radius: var(--radius-md); padding: 15px 18px; transition: border-color .15s, opacity .2s; }
.dir-card:hover { border-color: var(--d-border-2); }
.dir-card.off { opacity: .55; }
.dir-card.fresh { border-color: var(--accent); animation: ctxIn .5s ease; }
.dir-tog { width: 38px; height: 22px; border-radius: 99px; background: var(--d-border-2); position: relative; cursor: pointer; transition: background .2s; flex: none; border: none; padding: 0; }
.dir-tog::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .2s cubic-bezier(.22,.61,.36,1); }
.dir-tog.on { background: var(--accent); }
.dir-tog.on::after { transform: translateX(16px); }
.dir-body { flex: 1; min-width: 0; }
.dir-text { font-size: 14.5px; color: var(--d-text); margin-bottom: 6px; }
.dir-sub { display: flex; flex-wrap: wrap; gap: 14px; font-family: var(--font-mono); font-size: 11.5px; color: var(--d-text-3); }
.dir-cad { display: inline-flex; align-items: center; gap: 5px; }
.dir-new { color: var(--accent); }

/* novelty radar */
.nov-top { display: grid; grid-template-columns: 280px 1fr; gap: 16px; }
@media (max-width: 860px){ .nov-top { grid-template-columns: 1fr; } }
.nov-meter-card { display: flex; flex-direction: column; }
.nov-big { font-family: var(--font-display); font-weight: 600; font-size: 52px; letter-spacing: -.03em; line-height: 1; margin: 12px 0 14px; }
.nov-meter { height: 9px; border-radius: 999px; background: var(--d-elev); overflow: hidden; }
.nm-fill { height: 100%; border-radius: 999px; transition: width 1s cubic-bezier(.22,.61,.36,1); }
.nov-trend { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--d-text-2); margin-top: 14px; }
.nov-claim { font-size: 15px; color: var(--d-text); line-height: 1.5; margin: 10px 0 0; }
.def-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.def-chips span { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); border-radius: var(--radius-pill); padding: 5px 11px; }
.nov-list { display: flex; flex-direction: column; gap: 10px; }
.nov-row { display: flex; gap: 16px; align-items: center; background: var(--d-surface); border: 1px solid var(--d-border); border-radius: var(--radius-md); padding: 15px 18px; cursor: pointer; transition: border-color .15s, transform .15s; }
.nov-row:hover { border-color: var(--d-border-2); transform: translateY(-2px); }
.nov-lvl { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; border: 1px solid; border-radius: var(--radius-pill); padding: 5px 11px; flex: none; }
.nov-rb { flex: 1; min-width: 0; }
.nov-rb h4 { font-family: var(--font-display); font-weight: 500; font-size: 16px; margin: 0 0 8px; letter-spacing: -.01em; }
.nov-od { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 13px; color: var(--d-text-2); }
.nov-od b { color: var(--d-text-3); font-weight: 500; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; margin-right: 4px; }
.nov-mi b { color: var(--accent); }
.nov-date { font-family: var(--font-mono); font-size: 11px; color: var(--d-text-3); flex: none; }
.reposition-card { display: flex; gap: 16px; align-items: flex-start; background: linear-gradient(135deg, var(--d-surface), var(--d-bg-2)); border: 1px solid var(--accent); border-radius: var(--radius-md); padding: 20px 22px; margin-top: 22px; }
.rc-ic { width: 42px; height: 42px; border-radius: 11px; background: color-mix(in srgb, var(--accent) 14%, transparent); display: grid; place-items: center; flex: none; }
.reposition-card p { font-size: 14.5px; color: var(--d-text); line-height: 1.55; margin: 0 0 4px; max-width: 90ch; }

/* living related work */
.rw-draftbar { display: flex; align-items: center; gap: 9px; font-size: 13.5px; color: var(--d-text-2); background: var(--d-surface); border: 1px solid var(--d-border); border-radius: var(--radius-sm); padding: 11px 15px; margin-bottom: 22px; }

.rw-fit { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--d-text-2); }
.rw-sentence { background: var(--d-bg-2); border: 1px solid var(--d-border); border-radius: 9px; padding: 13px 15px; margin-top: 14px; position: relative; }
.rws-cap { font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--d-text-3); }
.rw-sentence p { font-size: 14px; color: var(--d-text); line-height: 1.55; margin: 8px 0 0; max-width: 86ch; }
.rws-copy { position: absolute; top: 11px; right: 11px; padding: 5px 11px !important; font-size: 12px !important; }
.rw-table { padding: 6px 8px; overflow-x: auto; }
.rw-table table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.rw-table th { font-family: var(--font-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--d-text-3); padding: 12px 14px; text-align: center; border-bottom: 1px solid var(--d-border); }
.rw-table th:first-child { text-align: left; }
.rw-table td { padding: 13px 14px; border-bottom: 1px solid var(--d-border); text-align: center; color: var(--d-text-2); }
.rw-table tr:last-child td { border-bottom: none; }
.rt-name { text-align: left !important; color: var(--d-text) !important; font-weight: 500; display: flex; align-items: center; gap: 9px; }
.row-you td { background: color-mix(in srgb, var(--accent) 7%, transparent); }
.you-tag { font-family: var(--font-mono); font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: #042b23; background: var(--accent); border-radius: 5px; padding: 1px 6px; }
body.app.light .you-tag { color: #04372b; }
.rt-no { color: var(--d-text-3); }

/* citation advisor */
.ca-pick { background: var(--d-surface); border: 1px solid var(--d-border); border-radius: var(--radius-md); padding: 20px; margin-bottom: 18px; }
.ca-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.ca-chip { font-size: 12.5px; color: var(--d-text-2); background: var(--d-elev); border: 1px solid var(--d-border); border-radius: var(--radius-pill); padding: 7px 13px; cursor: pointer; transition: border-color .15s, color .15s; }
.ca-chip:hover { border-color: var(--d-border-2); color: var(--d-text); }
.ca-chip.on { border-color: var(--accent); color: var(--d-text); background: var(--d-elev-2); }
.ca-q { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 16px; border-top: 1px solid var(--d-border); }
.ca-q > span { font-size: 15px; color: var(--d-text); }
.ca-q b { font-weight: 600; }
.ca-thinking { display: flex; align-items: center; gap: 11px; color: var(--d-text-2); font-size: 14px; padding: 18px 4px; }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: bounce 1.2s infinite; }
.dots i:nth-child(2){ animation-delay: .15s; } .dots i:nth-child(3){ animation-delay: .3s; }
@keyframes bounce { 0%,60%,100%{ transform: translateY(0); opacity:.5; } 30%{ transform: translateY(-6px); opacity:1; } }
.ca-answer { display: flex; flex-direction: column; gap: 16px; }
.ca-verdict { display: flex; align-items: center; gap: 14px; border-radius: var(--radius-md); padding: 16px 20px; border: 1px solid; }
.ca-verdict.yes { background: color-mix(in srgb, var(--accent) 10%, transparent); border-color: var(--accent); color: var(--accent); }
.ca-verdict.no { background: color-mix(in srgb, var(--d-text-3) 10%, transparent); border-color: var(--d-border-2); color: var(--d-text-2); }
.ca-verdict b { font-family: var(--font-display); font-weight: 600; font-size: 20px; letter-spacing: -.01em; display: block; }
.ca-verdict span { font-family: var(--font-mono); font-size: 11.5px; color: var(--d-text-3); }
.ca-rows { display: flex; flex-direction: column; gap: 2px; }
.ca-row { display: grid; grid-template-columns: 230px 1fr; gap: 18px; padding: 15px 4px; border-bottom: 1px solid var(--d-border); }
@media (max-width: 760px){ .ca-row { grid-template-columns: 1fr; gap: 7px; } }
.ca-k { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--d-text-3); }
.ca-row p { font-size: 14.5px; color: var(--d-text); line-height: 1.55; margin: 0; }
.ca-sentence { font-style: italic; color: var(--d-text) !important; }

<!-- RR_DATA: loaded live from /api/rr-data — no fake data -->
<script>
(async function () {
  const root = document.getElementById('root');

  // Minimal loading screen while we fetch
  root.innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;
                min-height:100vh;background:var(--d-bg);gap:18px">
      <svg width="44" height="44" viewBox="0 0 30 30" fill="none">
        <circle cx="15" cy="15" r="14" stroke="#0e8a6c" stroke-width="1.4" opacity=".5"/>
        <circle cx="15" cy="15" r="8.5" stroke="#14a883" stroke-width="1.4" opacity=".8"/>
        <circle cx="15" cy="15" r="3" fill="#2fcf9e"/>
        <path d="M15 15 L27 6" stroke="#2fcf9e" stroke-width="1.8" stroke-linecap="round"
              style="transform-origin:15px 15px;animation:spin 1.4s linear infinite"/>
      </svg>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      <div style="font-family:monospace;font-size:13px;color:#6a7c73;letter-spacing:.08em">
        Loading research data…
      </div>
    </div>`;

  try {
    const res = await fetch('/api/rr-data');
    if (!res.ok) throw new Error('API ' + res.status);
    window.RR_DATA = await res.json();
  } catch (err) {
    console.warn('[FrontierOS] /api/rr-data failed:', err);
    // Show connection error — server may not be running
    root.innerHTML = `
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;
                  min-height:100vh;background:var(--d-bg);gap:14px;padding:40px;text-align:center">
        <div style="font-size:32px">◎</div>
        <div style="font-family:var(--font-display,sans-serif);font-size:20px;font-weight:600;
                    color:var(--d-text,#eaf2ed)">Could not connect to FrontierOS server</div>
        <div style="font-size:14px;color:var(--d-text-2,#9fb0a7);max-width:380px;line-height:1.6">
          Make sure the server is running:<br>
          <code style="background:var(--d-elev,#16221c);padding:6px 12px;border-radius:6px;
                       font-size:13px;display:inline-block;margin-top:10px">./start.sh</code>
        </div>
        <button onclick="location.reload()"
          style="margin-top:8px;padding:10px 24px;background:#063f33;color:#eafaf4;border:none;
                 border-radius:999px;font-size:14px;cursor:pointer;">Retry</button>
      </div>`;
    return; // stop — React won't mount without data
  }

  // Ensure backward-compat: if API NAV is flat list, convert to grouped format
  if (window.RR_DATA.NAV && Array.isArray(window.RR_DATA.NAV) && window.RR_DATA.NAV[0] && !window.RR_DATA.NAV[0].items) {
    const groups = {};
    window.RR_DATA.NAV.forEach(item => {
      const g = item.section || '';
      if (!groups[g]) groups[g] = [];
      groups[g].push(item);
    });
    window.RR_DATA.NAV = Object.entries(groups).map(([grp, items]) => ({ group: grp, items }));
  }

  // Signal to React that data is ready — React scripts below will mount
  window.__RR_DATA_READY = true;
})();
</script>

    transition:transform .12s cubic-bezier(.3,.7,.4,1),box-shadow .12s}
  .twk-chip:hover{transform:translateY(-1px);
    box-shadow:0 0 0 .5px rgba(0,0,0,.18),0 4px 10px rgba(0,0,0,.12)}
  .twk-chip[data-on="1"]{box-shadow:0 0 0 1.5px rgba(0,0,0,.85),
    0 2px 6px rgba(0,0,0,.15)}
  .twk-chip>span{position:absolute;top:0;bottom:0;right:0;width:34%;
    display:flex;flex-direction:column;box-shadow:-1px 0 0 rgba(0,0,0,.1)}

  .twk-chip>span>i:first-child{box-shadow:none}
  .twk-chip svg{position:absolute;top:6px;left:6px;width:13px;height:13px;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
`;

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

<!-- Shared components (Sidebar, Topbar, PaperCard, etc.) -->
<script type="text/babel">
/* FrontierOS — shared UI components */
const { useState, useEffect, useRef, useMemo } = React;

/* ---- Brand mark (radar) ---- */
function Mark({ size = 26, dark = true }) {
  const src = dark ? '/assets/logo-mark-dark.svg' : '/assets/logo-mark.svg';
  return <img src={src} alt="" width={size} height={size} style={{ display: 'block', flex: 'none' }} />;
}

/* ---- Badge ---- */
const BADGE_VARIANT = {
  'High Opportunity': 'purple', 'Code Potential': 'cyan', 'Easy Reproduce': 'green',
  'High Compute': 'orange', 'Weak Evidence': 'rose', 'New Benchmark': 'cyan', 'Saturated Topic': 'gray',
};
function Badge({ children, variant }) {
  const v = variant || BADGE_VARIANT[children] || 'gray';
  return <span className={`badge badge-${v}`}>{children}</span>;
}

/* ---- Score pill ---- */
function Score({ label, value }) {
  const num = typeof value === 'number';
  const hi = num && value >= 8;
  return <span className={`score${hi ? ' hi' : ''}`}>{label} <b>{value}</b></span>;
}

/* ---- Sparkline ---- */
function Spark({ data, w = 70, hgt = 22, color = 'var(--accent)' }) {
  const min = Math.min(...data), max = Math.max(...data);
  const rng = max - min || 1;
  const pts = data.map((d, i) => `${(i / (data.length - 1)) * w},${hgt - ((d - min) / rng) * (hgt - 3) - 1.5}`).join(' ');
  return (
    <svg className="spark" width={w} height={hgt}>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round" />
    </svg>
  );
}

/* ---- KPI card ---- */
function KpiCard({ kpi }) {
  return (
    <div className="card kpi">
      <div className="k-top">
        <span className="k-label">{kpi.label}</span>
        <Spark data={kpi.spark} color={kpi.dir === 'down' ? 'var(--rose)' : 'var(--accent)'} />
      </div>
      <div className="k-val">{kpi.value}</div>
      <span className={`k-delta ${kpi.dir}`}>{kpi.dir === 'up' ? '▲' : '▼'} {kpi.delta} today</span>
    </div>
  );
}

/* ---- Sidebar ---- */
function Sidebar({ page, setPage, cats, activeCats, toggleCat }) {
  const { NAV } = window.RR_DATA;
  const profile = ['LLM Agents', 'RAG', 'ML Systems', 'Computer Vision', 'Model Compression'];
  return (
    <aside className="sidebar">
      <div className="sb-brand"><Mark /> FrontierOS</div>

      <nav className="sb-section sb-nav">
        {NAV.map((grp, gi) => (
          <div key={gi} className="nav-group">
            {grp.group && <div className="nav-group-cap">{grp.group}</div>}
            {grp.items.map(n => (
              <button key={n.id} className={`nav-item${page === n.id ? ' active' : ''}`} onClick={() => setPage(n.id)}>
                <span className="ni-ic"><Icon name={n.icon} size={16} /></span>
                {n.label}
                {n.tag && <span className="ni-tag">{n.tag}</span>}
              </button>
            ))}
          </div>
        ))}
      </nav>

      <div className="sb-section">
        <div className="sb-cap">Tracked Categories</div>
        <div className="sb-chips">
          {cats.map(c => (
            <span key={c} className={`cat-chip${activeCats.includes(c) ? ' on' : ''}`} onClick={() => toggleCat(c)}>{c}</span>
          ))}
        </div>
      </div>

      <div className="sb-section">
        <div className="sb-cap">Research Profile</div>
        <div className="sb-chips">
          {profile.map(p => <span key={p} className="cat-chip" style={{ cursor: 'default' }}>{p}</span>)}
        </div>
      </div>

      <div className="sb-profile">
        <div className="av">AR</div>
        <div className="who"><b>Avery Reese</b><span>ML Research · Pro</span></div>
      </div>
    </aside>
  );
}

/* ---- Topbar ---- */
function Topbar({ onSearch }) {
  return (
    <header className="topbar">
      <div className="global-search" onClick={e => e.currentTarget.querySelector('input').focus()}>
        <Icon name="search" size={16} stroke="var(--d-text-3)" />
        <input placeholder='Ask Research Memory anything — “Find RAG papers with code from this week”'
          onKeyDown={e => { if (e.key === 'Enter' && e.target.value.trim()) onSearch(e.target.value.trim()); }} />

        <button className="icon-btn"><Icon name="bell" size={16} /></button>
      </div>
    </header>
  );
}

/* ---- Paper card ---- */
function PaperCard({ paper, onOpen, onAction }) {
  const s = paper.scores;
  return (
    <div className="card paper-card" onClick={() => onOpen(paper)}>
      <div className="pc-badges">
        <Badge variant="blue">{paper.cat}</Badge>
        {paper.tags.map(t => <Badge key={t} variant="gray">{t}</Badge>)}
        {paper.badges.map(b => <Badge key={b}>{b}</Badge>)}
        {paper.code && <Badge variant="cyan">Code · {s.build}</Badge>}
      </div>
      <h3>{paper.title}</h3>
      <p className="pc-sum">{paper.summary}</p>
      <div className="pc-meta">{paper.authors.join(', ')} · {paper.date} · arXiv:{paper.id}</div>
      <div className="pc-scores">
        <Score label="Novelty" value={s.novelty} />
        <Score label="Impact" value={s.impact} />
        <Score label="Reprod." value={s.reprod} />
        <Score label="Build" value={s.build} />
        <Score label="Opp." value={s.opportunity} />
      </div>
      <div className="pc-tax"><b>Methods:</b> {paper.methods.join(', ')}</div>
      <div className="pc-tax"><b>Datasets:</b> {paper.datasets.join(', ')}</div>
      <div className="pc-actions" onClick={e => e.stopPropagation()}>

        <button className="btn btn-sm" onClick={() => onAction('code', paper)}><Icon name="code" size={14} /> Generate Code</button>
        <button className="btn btn-sm" onClick={()=>{ onAction('save', paper); PG.savePaper(paper).catch(()=>{}); }}><Icon name="bookmark" size={14} /> Add to Library</button>
        <button className="btn btn-sm btn-ghost" onClick={() => onAction('compare', paper)}><Icon name="compare" size={14} /> Compare</button>
      </div>

/* ---- Page header ---- */
function PageHead({ crumb, title, sub, children }) {
  return (
    <div className="page-head">
      {crumb && <div className="crumb">{crumb}</div>}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', gap: 20, flexWrap: 'wrap' }}>
        <div>
          <h1>{title}</h1>
          {sub && <p>{sub}</p>}
        </div>
        {children && <div style={{ display: 'flex', gap: 10 }}>{children}</div>}
      </div>
    </div>
  );
}

function StubPage({ icon, crumb, title, desc, feats }) {
  return (
    <div className="page fade-in">
      <PageHead crumb={crumb} title={title} />
      <div className="stub">
        <div>
          <div className="stub-ic"><Icon name={icon} size={28} /></div>
          <h2>{title} workspace</h2>
          <p>{desc}</p>
          <div className="feats">{feats.map(f => <span key={f}>{f}</span>)}</div>

Object.assign(window, { Mark, Badge, Score, Spark, KpiCard, Sidebar, Topbar, PaperCard, PageHead, StubPage });
