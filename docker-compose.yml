# Optional production services for ResearchRadar.
# The app runs fine on SQLite + local memory without these.
# Start only what you need, e.g.:  docker compose up -d qdrant
version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    profiles: ["memory", "all"]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: researchradar
      POSTGRES_USER: researchradar
      POSTGRES_PASSWORD: researchradar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    profiles: ["db", "all"]

volumes:
  qdrant_storage:
  postgres_data:
